<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Script Coverage</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#05070B">
<link href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&family=IBM+Plex+Mono:wght@400;500;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#07090F;--p1:#0E1320;--p2:#131A2B;--line:#1F2A42;--tx:#E6ECF5;--mu:#8794A6;--ac:#E5A93C;--gd:#4ADE80;--bd:#F87171;--wn:#FBBF24;--bl:#60A5FA;--pu:#A78BFA}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--tx);font:14px/1.5 Inter,system-ui,sans-serif;display:flex;flex-direction:column}
.mono{font-family:'IBM Plex Mono',monospace}
button,select,input,textarea{font:inherit;color:inherit}
header{display:flex;align-items:center;gap:10px;padding:8px 12px;border-bottom:1px solid var(--line);flex-wrap:wrap}
header a.back{color:var(--mu);text-decoration:none;font-size:20px;line-height:1}
header h1{font-size:15px;margin:0;font-weight:800;letter-spacing:.04em;text-transform:uppercase}
header h1 small{color:var(--mu);font-weight:500;margin-left:6px;text-transform:none;letter-spacing:0}
.sp{flex:1}
.btn{background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:8px;padding:6px 11px;cursor:pointer;font-size:12px;font-weight:600;white-space:nowrap}
.btn:hover{border-color:#34436a}.btn.g{border-color:#7a5a16;color:var(--ac)}.btn.p{background:var(--ac);color:#000;border-color:var(--ac)}.btn.sm{padding:3px 8px;font-size:11px}.btn:disabled{opacity:.4;cursor:default}
nav.tabs{display:flex;gap:2px;padding:0 8px;border-bottom:1px solid var(--line);overflow-x:auto;flex:0 0 auto}
nav.tabs button{background:none;border:0;border-bottom:2px solid transparent;padding:9px 12px;color:var(--mu);font-weight:700;font-size:12px;letter-spacing:.06em;text-transform:uppercase;cursor:pointer;white-space:nowrap}
nav.tabs button.on{color:var(--tx);border-color:var(--ac)}
nav.tabs .n{background:#1b2540;border-radius:9px;padding:0 6px;margin-left:5px;font-size:10px}
main{flex:1;min-height:0;overflow:auto;padding:14px;position:relative}
.wrap{max-width:1100px;margin:0 auto}
.card{background:var(--p1);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
.card h2{margin:0 0 8px;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--mu)}
.card h3{margin:12px 0 4px;font-size:13px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px}
.big{font-size:64px;font-weight:900;line-height:1}
.chip{display:inline-block;border-radius:6px;padding:1px 7px;font-size:11px;font-weight:700;font-family:'IBM Plex Mono',monospace;background:#1b2540}
.sc{display:inline-block;min-width:34px;text-align:center;border-radius:6px;padding:1px 6px;font:700 12px 'IBM Plex Mono',monospace;color:#000}
.bar{height:8px;border-radius:4px;background:#1b2540;overflow:hidden;margin:4px 0}.bar i{display:block;height:100%}
.cat{display:grid;grid-template-columns:90px 1fr 38px;gap:8px;align-items:center;font-size:13px}
.cite{display:inline-block;margin:2px 4px 2px 0;padding:2px 8px;border:1px solid var(--line);border-radius:14px;background:#0a0f1c;color:var(--bl);font-size:11.5px;cursor:pointer;max-width:100%;text-align:left}
.cite:hover{border-color:var(--bl);background:#0f1730}
.cite b{font-family:'IBM Plex Mono',monospace;color:var(--ac);margin-right:5px}
.mu{color:var(--mu)}.sm{font-size:12px}
.row{padding:8px 0;border-top:1px solid var(--line)}.row:first-child{border:0}
.tip{border-left:3px solid var(--ac);padding:2px 0 2px 9px;margin:5px 0;color:#cbd5e1;font-size:13px}
.pill{display:inline-block;font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;border-radius:4px;padding:1px 6px;margin-right:6px}
.pill.fix{background:#14532d;color:#86efac}.pill.warn{background:#713f12;color:#fde68a}.pill.note{background:#1e3a5f;color:#bfdbfe}.pill.trope{background:#4c1d95;color:#ddd6fe}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.filters button{background:#0E1320;border:1px solid var(--line);border-radius:14px;padding:3px 11px;font-size:12px;cursor:pointer}.filters button.on{background:var(--ac);color:#000;border-color:var(--ac)}
/* script view */
.sv{display:grid;grid-template-columns:200px minmax(0,1fr) 340px;gap:12px;height:100%}
.sv>div{min-height:0;overflow:auto}
.nav .it{display:block;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid #151d33;padding:5px 6px;cursor:pointer;font-size:11px;color:var(--mu)}
.nav .it:hover,.nav .it.on{color:var(--tx);background:#0E1320}.nav .it b{color:var(--ac);font-family:'IBM Plex Mono',monospace;margin-right:5px}
.page{background:#0b0f19;border:1px solid var(--line);border-radius:8px;padding:18px 14px;font-family:'Courier Prime',monospace;font-size:13px;line-height:1.45}
.ln{padding:1px 4px;border-radius:3px;cursor:pointer;position:relative;white-space:pre-wrap;overflow-wrap:anywhere}
.ln:hover{background:#121a2e}
.ln.scn{font-weight:700;text-transform:uppercase;margin-top:16px}
.ln.chr{margin-left:34%;font-weight:700;text-transform:uppercase;margin-top:9px}
.ln.par{margin-left:26%;color:#9CA3AF;font-style:italic}.ln.dlg{margin:0 14% 0 20%}.ln.trn{text-align:right;font-weight:700;margin-top:8px}.ln.pbk{margin-top:9px}
.ln.i-fix{box-shadow:inset 3px 0 #4ade80}.ln.i-warn{box-shadow:inset 3px 0 #fbbf24}.ln.i-note{box-shadow:inset 3px 0 #60a5fa}.ln.i-trope{box-shadow:inset 3px 0 #a78bfa}
.ln.sel{background:#3a2d0b!important;outline:1px solid var(--ac)}
.ln .pg{position:absolute;right:2px;top:0;font:10px 'IBM Plex Mono',monospace;color:#3d4a68}
.panel{background:var(--p1);border:1px solid var(--line);border-radius:10px;padding:12px}
.panel h3{margin:0 0 4px}
textarea.ed{width:100%;min-height:70px;background:#05070B;border:1px solid var(--line);border-radius:6px;padding:7px;font-family:'Courier Prime',monospace;font-size:13px}
input.tx,select.tx{background:#05070B;border:1px solid var(--line);border-radius:6px;padding:6px 8px;width:100%}
.sug{border:1px solid var(--line);border-radius:8px;padding:8px;margin:6px 0;background:#0a0f1c}
.sug .pv{font:12px 'Courier Prime',monospace;margin:4px 0;color:#cbd5e1;white-space:pre-wrap}
del{background:#4c1519;color:#fecaca;text-decoration:line-through}ins{background:#14391f;color:#bbf7d0;text-decoration:none}
.dh{border:1px solid var(--line);border-radius:8px;margin:6px 0;background:#0a0f1c}.dh summary{cursor:pointer;padding:6px 10px;font-size:12px}
.dl2{font:12px 'Courier Prime',monospace;padding:1px 10px;white-space:pre-wrap}.dl2.a{background:#10301b}.dl2.r{background:#35161a}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:60;display:flex;align-items:center;justify-content:center;padding:14px}.modal>div{background:var(--p1);border:1px solid var(--line);border-radius:12px;max-width:760px;width:100%;max-height:88vh;overflow:auto;padding:16px}
.toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:#111827;border:1px solid var(--ac);padding:8px 14px;border-radius:8px;z-index:50;display:none}
.empty{max-width:620px;margin:6vh auto;text-align:center}
.empty textarea{width:100%;height:150px;background:#05070B;border:1px solid var(--line);border-radius:8px;padding:8px;font-family:'Courier Prime',monospace}
@media(max-width:1000px){.sv{grid-template-columns:minmax(0,1fr);height:auto}.sv>div{overflow:visible}.nav{display:none}.panel{position:sticky;bottom:0;max-height:55vh;overflow:auto;z-index:5}}
@media print{header,nav.tabs,.noprint{display:none!important}body{background:#fff;color:#000;display:block}main{overflow:visible}.card,.panel{background:#fff;border-color:#bbb}.mu{color:#555}}

header{padding-left:58px;padding-right:56px;min-height:48px}
.mbtn{position:fixed;top:6px;width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:#111827;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;padding:0;color:var(--tx);z-index:70;text-decoration:none;font-size:16px}
#cvBurger{left:10px}#cvBurger span{display:block;width:18px;height:2px;background:currentColor;border-radius:1px;box-shadow:0 6px currentColor,0 -6px currentColor}
.xbtn{right:10px;color:#FCA5A5;border-color:#7F1D1D}
#cvScrim{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:80}
#cvSheet{display:none;position:fixed;left:8px;top:52px;width:340px;max-width:calc(100vw - 16px);max-height:calc(100vh - 64px);overflow:auto;background:#111827;border:1px solid #1F2A42;border-radius:12px;padding:12px;z-index:90;box-shadow:0 20px 45px rgba(0,0,0,.8)}
#cvSheet .btn,#cvSheet select{display:block;width:100%;text-align:left;margin:0 0 6px;padding:10px 12px;font-size:13px}
body.cvm #cvScrim,body.cvm #cvSheet{display:block}
</style>
<style id="ph-touch">button,a,[onclick],select,summary,label{touch-action:manipulation;-webkit-tap-highlight-color:transparent}@media (pointer:coarse){.btn,button.btn{min-height:40px}#cvSheet button,#cvSheet select{min-height:44px}#phx button{min-height:44px}#phx input,#phx select,#cvSheet input,#cvSheet select,.modal input,.modal select,.modal textarea,#fIn,#ePaste,#ePasteGo~textarea{font-size:16px}textarea{font-size:max(16px,1em)}}</style></head>
<body>
<header>
  <button class="mbtn" id="cvBurger" aria-label="Menu" title="Menu"><span></span></button>
  <h1>Script Coverage <small id="hTitle"></small></h1>
  <a class="mbtn xbtn" id="cvClose" href="filmhub.html" aria-label="Close" title="Close and go back to filmHUB. Your saved versions stay in this browser.">&#10005;</a>
</header>
<div id="cvScrim"></div>
<div id="cvSheet" role="dialog" aria-label="Script coverage menu">
  <div class="mu sm" style="margin:0 2px 8px">Format</div>
  <select id="fmtSel" class="tx" title="Format for page-count and structure checks"><option value="FEATURE">Feature</option><option value="PILOT">TV pilot</option><option value="TV60">TV 60 min</option><option value="TV30">TV 30 min</option><option value="SHORT">Short</option></select>
  <button class="btn g" id="bLoad">Load script</button>
  <button class="btn" id="bHub">From filmHUB</button>
  <button class="btn" id="bFmt" disabled>Auto-format</button>
  <button class="btn" id="bSave" disabled>Save version</button>
  <button class="btn" id="bUndo" disabled>Undo</button>
  <button class="btn" id="bExp" disabled>Export</button>
  <a class="btn" href="filmhub.html" style="text-decoration:none;text-align:center">Back to filmHUB</a>
  <input type="file" id="fIn" accept=".txt,.fountain,.fdx,.pdf,.json,.html,.htm" style="display:none">
</div>
<nav class="tabs" id="tabs"></nav>
<main id="main"></main>
<div class="toast" id="toast"></div>
<script src="lib/autotag.js"></script>
<script src="lib/screenplay.js"></script>
<script src="lib/cov-core.js"></script>
<script src="lib/cov-measures.js"></script>
<script src="lib/cov-tropes.js"></script>
<script src="lib/cov-params.js"></script>
<script src="lib/cov-repair.js"></script>
<script src="lib/cov-report.js"></script>
<script src="lib/cov-diff.js"></script>
<script>
(function(){
'use strict';
var C=window.PHCov,U=C.util,$=function(i){return document.getElementById(i)};
var S={raw:'',R:null,tab:'summary',undo:[],versions:[],sel:null,sIdx:null,filter:{cat:'All',sev:'All'},dismissed:{},notes:[],diff:null,cmp:null,vA:'',vB:'',base:null};
var TABS=[['summary','Summary'],['logline','Logline'],['params','100 Parameters'],['findings','Findings'],['script','Script'],['tropes','Tropes'],['versions','Versions & diff']];
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function toast(t){var e=$('toast');e.textContent=t;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(function(){e.style.display='none'},2600)}
function col(s){if(s==null)return'#3d4a68';return s>=8?'#4ADE80':s>=7?'#A3E635':s>=6?'#FBBF24':s>=4?'#FB923C':'#F87171'}
function chip(s){return '<span class="sc" style="background:'+col(s)+'">'+(s==null?'n/a':(+s).toFixed(1))+'</span>'}
function ask(t){return window.prompt(t)}

/* ---------- storage: IndexedDB with in-memory fallback ---------- */
var DB=null,MEM=[];
function dbOpen(){return new Promise(function(res){try{var r=indexedDB.open('prohub_cov_v1',1);r.onupgradeneeded=function(){r.result.createObjectStore('v',{keyPath:'id'})};r.onsuccess=function(){DB=r.result;res()};r.onerror=function(){res()}}catch(e){res()}})}
function dbAll(){return new Promise(function(res){if(!DB)return res(MEM.slice());try{var q=DB.transaction('v').objectStore('v').getAll();q.onsuccess=function(){res(q.result||[])};q.onerror=function(){res([])}}catch(e){res([])}})}
function dbPut(o){return new Promise(function(res){if(!DB){MEM=MEM.filter(function(x){return x.id!==o.id}).concat([o]);return res()}try{var t=DB.transaction('v','readwrite');t.objectStore('v').put(o);t.oncomplete=res;t.onerror=res}catch(e){res()}})}
function dbDel(id){return new Promise(function(res){if(!DB){MEM=MEM.filter(function(x){return x.id!==id});return res()}try{var t=DB.transaction('v','readwrite');t.objectStore('v').delete(id);t.oncomplete=res;t.onerror=res}catch(e){res()}})}
function loadVersions(){return dbAll().then(function(a){S.versions=a.sort(function(x,y){return x.ts-y.ts});})}

/* ---------- running the analysis ---------- */
function analyze(raw,keepTab){
  var pr=C.prepare(raw,{skip:S.rep&&S.rep.skip,on:S.rep&&S.rep.on});if(pr.changed){raw=pr.text;setTimeout(function(){var rp=pr.repair;toast((pr.counts?'Run-on text detected: split into '+pr.counts.speeches+' speeches, '+pr.counts.actions+' action paragraphs. ':'')+(rp&&rp.total?'Cleaned up '+rp.total+' import problems (see Auto-format \u2192 Clean-up rules).':''))},400)}
  S.raw=raw;$('main').innerHTML='<div class="empty mu">Reading the script…</div>';
  return new Promise(function(res){setTimeout(function(){
    try{S.R=C.analyze(raw,{format:$('fmtSel').value});}catch(e){console.error(e);$('main').innerHTML='<div class="empty"><b>Could not read this script.</b><div class="mu sm">'+esc(e.message)+'</div></div>';return res();}
    S.sel=null;S.sIdx=null;
    $('hTitle').textContent=S.R.m.meta.title||'';
    ['bSave','bExp','bFmt'].forEach(function(i){$(i).disabled=false});$('bUndo').disabled=!S.undo.length;
    tabs();render();res();
  },30)});
}
function tabs(){
  var R=S.R,nf=R?R.issues.filter(function(i){return i.sev!=='trope'&&!S.dismissed[key(i)]}).length:0;
  $('tabs').innerHTML=TABS.map(function(t){var n=t[0]==='findings'?'<span class="n">'+nf+'</span>':t[0]==='versions'&&S.versions.length?'<span class="n">'+S.versions.length+'</span>':'';return '<button data-t="'+t[0]+'" class="'+(S.tab===t[0]?'on':'')+'">'+t[1]+n+'</button>'}).join('');
  [].forEach.call($('tabs').querySelectorAll('button'),function(b){b.onclick=function(){S.tab=b.getAttribute('data-t');tabs();render()}});
}
function key(i){return i.rule+'|'+i.li+'|'+(i.q||'').slice(0,30)}

/* ---------- citations ---------- */
function locate(c){
  var m=S.R.m;if(c.li!=null&&m.lines[c.li])return c.li;
  var q=String(c.q||'').toLowerCase().replace(/[“”"]/g,'').replace(/…/g,'').slice(0,28).trim();
  var sc=c.si!=null?m.scenes[c.si]:null,pool=sc?sc.lines:m.lines;
  if(q.length>5)for(var i=0;i<pool.length;i++){if(pool[i].text.toLowerCase().indexOf(q)>=0)return pool[i].i}
  return sc&&sc.hli!=null?sc.hli:null;
}
function citeHtml(c,idx){
  var q=String(c.q||'');return '<button class="cite" data-c="'+idx+'"><b>Sc '+esc(c.sc)+' · p.'+esc(c.pg)+'</b>'+(q?'“'+esc(q.length>90?q.slice(0,88)+'…':q)+'”':'')+'</button>';
}
var CITES=[];
function cites(list){return (list||[]).map(function(c){CITES.push(c);return citeHtml(c,CITES.length-1)}).join('')}
function wireCites(root){[].forEach.call(root.querySelectorAll('.cite'),function(b){b.onclick=function(){var c=CITES[+b.getAttribute('data-c')];if(c.__issue)return goIssue(c.__issue);goto(locate(c),null,c)}})}

/* ---------- render dispatch ---------- */
function render(){
  CITES=[];var R=S.R,main=$('main');
  if(!R){main.innerHTML=emptyHtml();wireEmpty();return}
  main.style.padding=S.tab==='script'?'10px':'14px';
  var h='<div class="wrap">';
  ({summary:sSummary,logline:sLogline,params:sParams,findings:sFindings,script:sScript,tropes:sTropes,versions:sVersions})[S.tab](main);
  wireCites(main);
}
function emptyHtml(){return '<div class="empty"><h2 style="font-size:22px;margin:0 0 6px">Rules-based script coverage</h2><p class="mu">Load a script (.txt, .fountain, .fdx, .pdf, or paste it). Every score, finding and suggestion is calculated from the text with fixed rules, and each one points to the scene, page and line it came from. Nothing leaves your browser.</p><p><button class="btn p" id="eLoad">Choose a file</button> <button class="btn" id="eHub">Use the filmHUB script</button></p><textarea id="ePaste" placeholder="…or paste the script here"></textarea><p><button class="btn" id="ePasteGo">Analyse pasted text</button></p></div>'}
function wireEmpty(){var a=$('eLoad');if(!a)return;a.onclick=function(){$('fIn').click()};$('eHub').onclick=fromHub;$('ePasteGo').onclick=function(){var t=$('ePaste').value;if(t.trim().length<200)return toast('Paste more of the script first');S.undo=[];analyze(t)}}

/* ---------- SUMMARY ---------- */
function sSummary(main){
  var R=S.R,m=R.m,st=R.stats,h='<div class="wrap">';
  h+='<div class="card"><div class="grid2"><div><div class="mu sm mono">OVERALL (1–10)</div><div class="big" style="color:'+col(R.overall)+'">'+R.overall.toFixed(1)+'</div><div style="font-size:18px;font-weight:800">'+esc(R.band)+' · '+esc(R.verdict)+'</div><div class="mu sm" style="margin-top:6px">Scored on a 1–10 scale in five categories (The bands and rules here are this tool’s own). Craft, emotional engagement and theme adjust the overall by '+(R.overallParts.mod>=0?'+':'')+R.overallParts.mod+'. Measures are indicative: rules read the page, not the performance.</div></div><div>';
  ['Premise','Plot','Character','Dialogue','Setting'].forEach(function(k){var s=R.cats[k].score;h+='<div class="cat"><span>'+k+'</span><div class="bar"><i style="width:'+(s?s*10:0)+'%;background:'+col(s)+'"></i></div>'+chip(s)+'</div>'});
  h+='<div class="mu sm mono" style="margin-top:8px">'+['CRAFT','EMOT','THEME'].map(function(k){var a=R.axes[k];return a.label+' '+(a.score==null?'n/a':a.score.toFixed(1))}).join(' · ')+'</div></div></div></div>';
  h+='<div class="card"><h2>Overall summary</h2>'+R.summary.map(function(p){return '<p style="margin:0 0 9px">'+esc(p)+'</p>'}).join('')+'<div class="mu sm mono">'+st.pages+' pp · '+st.scenes+' scenes · '+st.speaking+' speaking roles · dialogue '+Math.round(st.dialogueShare*100)+'% · '+st.locations+' locations · night '+Math.round(st.nightShare*100)+'% · interior '+Math.round(st.intShare*100)+'%</div></div>';
  h+='<div class="grid2"><div class="card"><h2>Strengths</h2>'+(R.sw.strengths.map(swHtml).join('')||'<div class="mu">No parameter scored 7.5 or above.</div>')+'</div><div class="card"><h2>Weaknesses</h2>'+(R.sw.weaknesses.map(swHtml).join('')||'<div class="mu">No parameter scored 5.5 or below.</div>')+'</div></div>';
  h+='<div class="card"><h2>Layered notes by category</h2>';
  ['Premise','Plot','Character','Dialogue','Setting'].forEach(function(k){var L=R.layers[k];h+='<h3>'+k+' '+chip(L.score)+'</h3>';
    L.observe.forEach(function(t){h+='<div class="sm" style="margin:3px 0">• '+esc(t)+'</div>'});
    L.works.forEach(function(w){h+='<div class="sm" style="margin:5px 0"><span class="pill fix">works</span><b>'+esc(w.name)+'</b> '+chip(w.s)+' '+esc(w.text)+'<div>'+cites(w.cites)+'</div></div>'});
    L.strains.forEach(function(w){h+='<div class="sm" style="margin:5px 0"><span class="pill warn">strains</span><b>'+esc(w.name)+'</b> '+chip(w.s)+' '+esc(w.text)+'<div>'+cites(w.cites)+'</div></div>'});
    L.tryThis.forEach(function(t){h+='<div class="tip">Try: '+esc(t.text)+'</div>'});});
  h+='</div>';
  if(R.quotes.length)h+='<div class="card"><h2>Lines worth protecting</h2>'+R.quotes.map(function(q){CITES.push({si:q.si,sc:q.sc,pg:q.pg,q:q.txt,li:q.li});return '<button class="cite" data-c="'+(CITES.length-1)+'"><b>'+esc(U.title(q.ch))+' · Sc '+q.sc+'</b>“'+esc(q.txt)+'”</button>'}).join('')+'</div>';

  h+='<div class="card"><h2>Score comparison</h2><div class="grid2"><div><div class="mu sm mono">OVERALL</div><div style="font-size:34px;font-weight:900">'+P.overall[0].toFixed(1)+' → <span style="color:'+col(P.overall[1])+'">'+P.overall[1].toFixed(1)+'</span></div></div><div>'+Object.keys(P.cats).map(function(k){var d=P.cats[k];return '<div class="cat"><span>'+k+'</span><span class="mono sm">'+(d[0]==null?'n/a':d[0])+' → '+(d[1]==null?'n/a':d[1])+'</span><span></span></div>'}).join('')+'</div></div>'+P.text.map(function(t){return '<div class="sm" style="margin-top:4px">• '+esc(t)+'</div>'}).join('')+'</div>';
  h+='<div class="card"><h2>Change log</h2>'+D.log.map(function(x){return '<div class="sm" style="padding:3px 0;border-top:1px solid var(--line)"><span class="pill '+(x.kind==='added'?'fix':x.kind==='removed'?'warn':'note')+'">'+x.kind+'</span>'+esc(x.text)+'</div>'}).join('')+'<p><button class="btn sm" id="logDl">Download change log</button></p></div>';
  h+='<div class="card"><h2>Scene-by-scene diff</h2><div class="filters"><button data-d="chg" class="on">Changed only</button><button data-d="all">All scenes</button></div><div id="dScenes"></div></div>';
  $('vOut').innerHTML=h;
  var mode='chg';function draw(){$('dScenes').innerHTML=D.scenes.filter(function(s){return mode==='all'||(s.status!=='same'&&s.status!=='renumbered')}).map(function(s){
    var title=(s.bnum!=null?'Sc '+s.bnum:'Sc '+s.anum)+' '+esc((s.b||s.a).heading)+' <span class="pill '+(s.status==='added'?'fix':s.status==='removed'?'warn':'note')+'">'+s.status+'</span><span class="mu sm">+'+s.stats.wAdd+' / -'+s.stats.wDel+' words</span>';
    var lines=s.hunks.filter(function(x){return mode==='all'||x.op!=='='||false}).map(function(x){if(x.op==='=')return '<div class="dl2 mu">'+esc(x.b)+'</div>';if(x.op==='+')return '<div class="dl2 a">+ '+esc(x.b)+'</div>';if(x.op==='-')return '<div class="dl2 r">- '+esc(x.a)+'</div>';return '<div class="dl2">~ '+x.words.map(function(w){return w[0]==='+'?'<ins>'+esc(w[1])+'</ins>':w[0]==='-'?'<del>'+esc(w[1])+'</del>':esc(w[1])}).join('')+'</div>'}).join('');
    return '<details class="dh"><summary>'+title+'</summary>'+lines+'</details>'}).join('')||'<div class="mu sm">No changes.</div>'}
  draw();[].forEach.call($('vOut').querySelectorAll('[data-d]'),function(b){b.onclick=function(){mode=b.getAttribute('data-d');[].forEach.call($('vOut').querySelectorAll('[data-d]'),function(x){x.classList.toggle('on',x===b)});draw()}});
  $('logDl').onclick=function(){dl('change-log.txt',D.log.map(function(x){return x.text}).join('\n')+'\n\n'+P.text.join('\n'))};
}
function saveVersion(){
  var name=ask('Name this version (e.g. Draft 3, after notes):');if(!name)return;var note=ask('Optional note:')||'';
  var v={id:'v'+Date.now(),name:name,note:note,ts:Date.now(),raw:S.raw,score:S.R.overall,pages:Math.round(S.R.m.pages*10)/10};
  dbPut(v).then(loadVersions).then(function(){toast('Version saved');tabs();if(S.tab==='versions')render()});
}

/* ---------- loading / exporting ---------- */
function dl(name,text,type){var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:type||'text/plain'}));a.download=name;document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},500)}
function fromHub(){
  try{var ms=JSON.parse(localStorage.getItem('prehub_master_v1')||'null');if(ms&&ms.lines&&ms.lines.length){var lines=ms.lines.map(function(l){return {type:PHScript.normType(l.type),text:String(l.text||'')}});var pr={};try{pr=JSON.parse(localStorage.getItem('prehub_v3')||'{}')}catch(e){}S.undo=[];return analyze(C.serialize(lines,{title:pr.projectName||''}))}}catch(e){}
  toast('No script found in filmHUB on this device yet');
}
$('bLoad').onclick=function(){S.importVer=false;$('fIn').click()};$('bHub').onclick=fromHub;$('bSave').onclick=saveVersion;$('bUndo').onclick=undo;
$('fmtSel').onchange=function(){if(S.raw)analyze(S.raw)};
$('fIn').onchange=function(){var f=this.files[0];this.value='';if(!f)return;
  var r=/\.html?$/i.test(f.name)?f.text():PHScript.readFile(f);
  Promise.resolve(r).then(function(t){if(typeof t!=='string')t=String(t||'');
    if(S.importVer){var v={id:'v'+Date.now(),name:f.name.replace(/\.[^.]+$/,''),note:'imported file',ts:Date.now(),raw:t,score:null,pages:0};
      var m=C.model(t);v.pages=Math.round(m.pages*10)/10;S.importVer=false;return dbPut(v).then(loadVersions).then(function(){toast('Added as a version');tabs();render()})}
    S.undo=[];return analyze(t)}).catch(function(e){toast(e&&e.message?e.message:'Could not read that file')})};
$('bExp').onclick=function(){
  var R=S.R,t=(R.m.meta.title||'script').replace(/[^\w]+/g,'_');
  var opts=[['Revised script (.fountain)',function(){dl(t+'_revised.fountain',C.serialize(R.m.lines.map(function(l){return l}),R.m.meta,{fountain:true}))}],['Revised script (.txt)',function(){dl(t+'_revised.txt',S.raw)}],['Coverage report (print / PDF)',function(){S.tab='summary';tabs();render();setTimeout(function(){window.print()},200)}],['Writer’s notes (.txt)',function(){if(!S.notes.length)return toast('No notes yet. Use “Add to notes” on findings');dl(t+'_notes.txt',S.notes.map(function(n,i){return (i+1)+'. '+n.text}).join('\n\n'))}],['Findings list (.csv)',function(){var rows=[['rule','category','severity','scene','page','message','quote']].concat(R.issues.map(function(i){return [i.rule,i.cat,i.sev,i.sc,i.pg,i.msg,i.q]}));dl(t+'_findings.csv',rows.map(function(r){return r.map(function(c){return '"'+String(c==null?'':c).replace(/"/g,'""')+'"'}).join(',')}).join('\n'),'text/csv')}]];
  var c=prompt(opts.map(function(o,i){return (i+1)+' = '+o[0]}).join('\n')+'\n\nType a number:');var n=parseInt(c,10);if(opts[n-1])opts[n-1][1]();
};

/* ---------- auto-format ---------- */
S.rep=S.rep||{skip:[],on:[]};
function openFmt(){
  if(!S.raw)return;var r;try{r=C.autoFormat(S.raw,{format:$('fmtSel').value,skip:S.rep.skip,on:S.rep.on})}catch(e){return toast('Could not format: '+e.message)}
  var st=r.stats,same=r.text.trim()===S.raw.trim();
  var warn=(r.before.scenes!==r.after.scenes||r.before.speakers!==r.after.speakers)?'<div class="tip" style="border-color:#f87171">Heads up: the scene or speaker count changes ('+r.before.scenes+' → '+r.after.scenes+' scenes, '+r.before.speakers+' → '+r.after.speakers+' speakers). Look at the preview before applying; you can Undo afterwards.</div>':'<div class="sm" style="color:var(--gd)">Check passed: '+r.after.scenes+' scenes and '+r.after.speakers+' speakers before and after.</div>';
  var d=document.createElement('div');d.className='modal';
  d.innerHTML='<div><h2 style="margin:0 0 6px">Auto-format the whole script</h2><div class="mu sm">Reads the markers already in the text (scene headings, CAPITAL-LETTER names, parentheticals, transitions, scene numbers, indentation) and rewrites the script in standard screenplay form. Wording is never changed.</div><div style="margin:10px 0"><span class="chip">'+st.headings+' headings</span> <span class="chip">'+st.cues+' character cues</span> <span class="chip">'+st.parens+' parentheticals</span> <span class="chip">'+st.transitions+' transitions</span> <span class="chip">'+st.reflowed+' wrapped lines joined into paragraphs</span> <span class="chip">'+st.spacing+' lines trimmed</span> <span class="chip">'+st.numbers+' scene numbers kept</span></div>'+warn+'<div id="fmtPv" class="mu sm" style="margin-top:8px">Building preview…</div><div style="display:flex;gap:8px;margin-top:12px"><button class="btn p" id="fmtGo"'+(same?' disabled':'')+'>'+(same?'Already formatted':'Apply formatting')+'</button><button class="btn" id="fmtNo">Cancel</button></div></div>';
  document.body.appendChild(d);$('fmtNo').onclick=function(){d.remove()};
  $('fmtGo').onclick=function(){d.remove();S.undo.push(S.raw);if(S.undo.length>30)S.undo.shift();analyze(r.text).then(function(){S.tab='script';S.sel=null;tabs();render();toast('Script formatted: '+st.reflowed+' lines joined, '+(st.headings+st.cues+st.parens+st.transitions)+' markers fixed')})};
  setTimeout(function(){try{var D=C.diff(S.raw,r.text,{format:$('fmtSel').value}),shown=0,h='';
    D.scenes.forEach(function(sc){sc.hunks.forEach(function(x){if((x.op==='~'||x.op==='=')&&shown<14&&x.a.trim()!==x.b.trim()){shown++;h+='<div class="dl2 r">- '+esc(x.a)+'</div><div class="dl2 a">+ '+esc(x.b)+'</div>'}})});
    $('fmtPv').innerHTML=h?'<b>Sample of the changes</b>'+h:'Only spacing changes.'}catch(e){$('fmtPv').textContent=''}},40);
  var rp=r.stats&&r.stats.repair;
  if(rp){var box=document.createElement('details');box.style.cssText='margin:8px 0';
    var h='<summary style="cursor:pointer"><b>Clean-up rules</b> <span class="mu sm">'+(rp.total?rp.total+' fixes from '+rp.log.filter(function(x){return x.n}).length+' rules':'nothing to clean')+'</span></summary>';
    (rp.notes||[]).forEach(function(n){h+='<div class="tip" style="border-color:#f87171">'+esc(n)+'</div>'});
    var gr='';rp.log.forEach(function(x){if(x.group!==gr){gr=x.group;h+='<div class="mu sm" style="margin-top:6px"><b>'+esc(gr)+'</b></div>'}
      var on=!x.skipped;h+='<label style="display:block;font-size:12px;padding:2px 0"><input type="checkbox" data-r="'+x.id+'"'+(on?' checked':'')+'> '+esc(x.name)+(x.n?' <b>('+x.n+')</b>':'')+(x.off?' <i class="mu">off by default</i>':'')+'<div class="mu sm" style="margin-left:20px">'+esc(x.desc)+(x.ex?'<br><i>e.g. '+esc(x.ex)+'</i>':'')+'</div></label>'});
    box.innerHTML=h;var pv=$('fmtPv');pv.parentNode.insertBefore(box,pv);if(S.rep.open)box.open=true;
    box.addEventListener('toggle',function(){S.rep.open=box.open});
    box.addEventListener('change',function(e){var id=e.target.getAttribute('data-r');if(!id)return;var R=rp.log.filter(function(x){return x.id===id})[0];
      S.rep.skip=S.rep.skip.filter(function(k){return k!==id});S.rep.on=S.rep.on.filter(function(k){return k!==id});
      if(e.target.checked){if(R&&R.off)S.rep.on.push(id)}else S.rep.skip.push(id);
      S.rep.open=true;d.remove();openFmt()})}
}
$('bFmt').onclick=function(){S.rep={skip:[],on:[]};openFmt()};

$('cvBurger').onclick=function(){document.body.classList.toggle('cvm')};$('cvScrim').onclick=function(){document.body.classList.remove('cvm')};
$('cvSheet').addEventListener('click',function(e){var b=e.target.closest('button.btn');if(b&&b.id!=='fmtSel')setTimeout(function(){document.body.classList.remove('cvm')},60)});
document.addEventListener('keydown',function(e){if(e.key==='Escape')document.body.classList.remove('cvm')});
document.addEventListener('keydown',function(e){if((e.ctrlKey||e.metaKey)&&e.key==='z'&&document.activeElement.tagName!=='TEXTAREA'&&document.activeElement.tagName!=='INPUT'){e.preventDefault();undo()}});
dbOpen().then(loadVersions).then(function(){tabs();render();
  var q=location.search.match(/[?&]hub=1/);if(q)fromHub();
});
})();
</script>
