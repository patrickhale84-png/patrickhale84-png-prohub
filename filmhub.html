<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>filmHUB | Production Desk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&family=IBM+Plex+Mono:wght@400;500;700&family=Montserrat:wght@600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
:root{
  --bg:#060911; --bar:#070C15; --line:#1B2436; --line2:#26344E; --tx:#E9EDF5; --mu:#8794A6; --dim:#4A5A70;
  --lime:#88C13F; --gold:#E5A93C;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100vh;height:100dvh;margin:0;overflow:hidden;background:var(--bg);color:var(--tx);
  font-family:"Segoe UI",-apple-system,BlinkMacSystemFont,"Montserrat",sans-serif;-webkit-font-smoothing:antialiased;}
button{font-family:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;}
a{color:inherit;text-decoration:none;}
:focus-visible{outline:2px solid var(--lime);outline-offset:2px;}
.mono{font-family:'IBM Plex Mono',ui-monospace,monospace;}

/* top bar */
.top{height:44px;display:flex;align-items:center;gap:10px;padding:0 12px;background:var(--bar);border-bottom:1px solid var(--line);}
.logo{font-weight:900;font-size:19px;letter-spacing:-.01em;white-space:nowrap;}
.logo b{color:var(--lime);font-weight:800;text-transform:lowercase;}
.desk{font-size:8.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--gold);background:#382B13;border:1px solid rgba(229,169,60,.6);padding:2px 7px;border-radius:4px;white-space:nowrap;}
.ptitle{font-size:12px;font-weight:900;text-transform:uppercase;letter-spacing:.04em;padding-left:10px;border-left:2px solid var(--lime);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:34vw;}
.psub{font-size:9.5px;font-weight:700;color:var(--mu);letter-spacing:.1em;text-transform:uppercase;white-space:nowrap;}
.tr{margin-left:auto;display:flex;align-items:center;gap:6px;}
.sync{display:flex;align-items:center;gap:6px;font-size:9.5px;background:#0B1322;border:1px solid #1B263B;padding:3px 7px;border-radius:5px;white-space:nowrap;}
.sync i{width:6px;height:6px;border-radius:50%;background:#00E5A3;animation:pa 2s infinite;}
.sync.off i{background:#E5A93C;animation:none;}
@keyframes pa{50%{opacity:.35}}
.tb{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 9px;font-size:9.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
  color:var(--mu);background:#0C1220;border:1px solid var(--line);border-radius:6px;white-space:nowrap;}
.tb:hover{color:#fff;border-color:var(--line2);}
.tb.g{color:var(--gold);background:#382B13;border-color:rgba(229,169,60,.6);}
@media(max-width:768px){.desk,.psub,.tb span,.sync span{display:none}.ptitle{max-width:40vw}}

/* metro grid */
.grid{height:calc(100dvh - 44px);display:grid;grid-template-columns:repeat(4,minmax(0,1fr));grid-template-rows:repeat(6,minmax(0,1fr));
  gap:4px;padding:4px;max-width:1440px;margin:0 auto;overflow:hidden;}
@media(min-width:601px) and (max-width:950px){.grid{grid-template-columns:repeat(6,minmax(0,1fr));grid-template-rows:repeat(5,minmax(0,1fr));gap:6px;padding:6px 8px}}
@media(min-width:951px){.grid{grid-template-columns:repeat(8,minmax(0,1fr));grid-template-rows:repeat(4,minmax(0,1fr));gap:8px;padding:8px 12px}}
.tile{position:relative;cursor:pointer;overflow:hidden;display:flex;flex-direction:column;justify-content:space-between;
  padding:clamp(5px,.8vh,10px);border-radius:3px;box-shadow:0 2px 6px rgba(0,0,0,.6);min-width:0;min-height:0;color:#fff;
  transition:transform .1s,filter .1s;user-select:none;}
.tile:hover{transform:scale(.99);filter:brightness(1.08)} .tile:active{transform:scale(.97)}
.tile.dk{color:#000}
.t1{grid-column:span 1;grid-row:span 1}
.tw{grid-column:span 4;grid-row:span 2}
.tt{display:flex;justify-content:space-between;align-items:flex-start;gap:4px}
.ti{font-size:clamp(16px,2.8vh,28px);line-height:1}
.tbadge{font-family:'IBM Plex Mono',monospace;font-size:clamp(6.5px,.9vh,9px);font-weight:700;letter-spacing:.04em;text-transform:uppercase;
  padding:1px 4px;border-radius:2px;background:rgba(0,0,0,.38);white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis;}
.dk .tbadge{background:rgba(0,0,0,.2)}
.tname{font-size:clamp(7.5px,1.1vh,11px);font-weight:800;letter-spacing:.02em;text-transform:uppercase;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.tsub{font-size:clamp(6.5px,.9vh,9px);font-weight:600;opacity:.85;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

/* hero */
.hero{background:#F0A30A;color:#000}
.hero .r1{display:flex;justify-content:space-between;align-items:flex-start;gap:6px}
.hero .ph{display:inline-block;background:rgba(0,0,0,.15);padding:1px 5px;border-radius:3px;font-family:'IBM Plex Mono',monospace;font-size:clamp(7px,1vh,9.5px);font-weight:700;text-transform:uppercase}
.hero .wx{font-size:clamp(8.5px,1.3vh,12px);font-weight:900;text-transform:uppercase;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.clock{font-family:'Courier Prime',monospace;font-weight:700;font-size:clamp(1.1rem,3vh,2.4rem);line-height:.9;letter-spacing:-.02em;white-space:nowrap}
.clock small{font-size:.4em;margin-left:2px}
.hero .cur{background:rgba(0,0,0,.14);border:1px solid rgba(0,0,0,.2);border-radius:3px;padding:3px 6px;overflow:hidden}
.hero .cur .a{display:flex;justify-content:space-between;font-family:'IBM Plex Mono',monospace;font-size:clamp(6.5px,.9vh,9px);font-weight:700;text-transform:uppercase}
.hero .cur .b{font-family:'IBM Plex Mono',monospace;font-weight:700;font-size:clamp(8.5px,1.3vh,12px);text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hero .st{display:grid;grid-template-columns:repeat(6,1fr);background:rgba(0,0,0,.14);border:1px solid rgba(0,0,0,.15);border-radius:3px;padding:2px 0}
.hero .st div{text-align:center;border-right:1px solid rgba(0,0,0,.2);min-width:0;font-family:'IBM Plex Mono',monospace}
.hero .st div:last-child{border:0}
.hero .st span{display:block;font-size:clamp(5.5px,.8vh,8px);opacity:.75}
.hero .st b{font-size:clamp(8px,1.3vh,13px);font-weight:700}

/* hub overlay */
.ov{position:fixed;inset:0;z-index:100;display:none;background:rgba(4,7,14,.94);backdrop-filter:blur(8px);justify-content:center;align-items:flex-start;overflow-y:auto}
.ov.on{display:flex}
.box{width:100%;max-width:1040px;min-height:100vh;background:#0B111E;display:flex;flex-direction:column;animation:pop .18s ease-out}
@media(min-width:768px){.ov{padding:28px 16px}.box{min-height:0;max-height:calc(100vh - 56px);border:1px solid rgba(255,255,255,.15);border-radius:12px;box-shadow:0 20px 45px rgba(0,0,0,.85);overflow:hidden}}
@keyframes pop{from{transform:scale(.97);opacity:0}to{transform:none;opacity:1}}
.bh{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:14px 18px 10px;border-bottom:1px solid rgba(255,255,255,.18);flex-shrink:0}
.bh .k{font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.bh h2{margin:2px 0 0;font-size:21px;font-weight:700;letter-spacing:-.01em}
.bh .acts{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.bb{padding:14px 18px 22px;overflow-y:auto;flex:1;min-height:0}
.btn{padding:6px 11px;font-size:11px;font-weight:700;border-radius:5px;background:rgba(255,255,255,.1);color:#fff}
.btn:hover{background:rgba(255,255,255,.2)}
.btn.on{background:var(--c,#00ABA9);color:#000}
.btn.red{background:#B91C1C}.btn.red:hover{background:#DC2626}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-bottom:14px}
.card{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:8px;padding:9px 10px}
.card .l{font-family:'IBM Plex Mono',monospace;font-size:9.5px;color:var(--mu);text-transform:uppercase;letter-spacing:.06em}
.card .v{font-size:19px;font-weight:800;margin-top:2px;font-family:'IBM Plex Mono',monospace}
.card .s{font-size:10px;color:var(--mu);margin-top:2px}
.sec{font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;margin:16px 0 8px;display:flex;align-items:center;gap:8px}
.sec::after{content:"";flex:1;height:1px;background:rgba(255,255,255,.1)}
.tw2{overflow-x:auto;border:1px solid rgba(255,255,255,.08);border-radius:8px}
table{width:100%;border-collapse:collapse;font-family:'IBM Plex Mono',monospace;font-size:11px;min-width:520px}
th{background:rgba(255,255,255,.08);text-transform:uppercase;font-size:9.5px;text-align:left;padding:7px 8px;white-space:nowrap;letter-spacing:.04em}
td{padding:6px 8px;border-top:1px solid rgba(255,255,255,.07);vertical-align:top}
tr:hover td{background:rgba(255,255,255,.03)}
.pill{display:inline-block;padding:1px 6px;border-radius:9px;font-size:9.5px;font-weight:700;border:1px solid currentColor;margin:1px 2px 1px 0;white-space:nowrap}
.bar{height:6px;background:rgba(255,255,255,.1);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--c,#00ABA9)}
.empty{padding:38px 12px;text-align:center;color:var(--mu);font-family:'IBM Plex Mono',monospace;font-size:12px;line-height:1.8}
.script{background:#000a;border:1px solid rgba(255,255,255,.1);border-radius:8px;padding:16px;font-family:'Courier Prime',monospace;font-size:13px;line-height:1.45;max-height:60vh;overflow-y:auto}
.script .sh{font-weight:700;text-transform:uppercase;margin:14px 0 6px}
.script .ac{margin:6px 0}
.script .ch{margin:10px 0 0 38%;font-weight:700;text-transform:uppercase}
.script .pa{margin-left:30%;font-style:italic;color:#9CA3AF}
.script .dl{margin:0 18% 0 24%}
.script .tr2{text-align:right;font-weight:700;margin:8px 0}
.daybox{border:1px solid rgba(255,255,255,.1);border-radius:8px;margin-bottom:12px;overflow:hidden}
.dayh{padding:8px 12px;background:rgba(255,255,255,.07);font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:700;text-transform:uppercase;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.row{display:flex;gap:10px;align-items:center;padding:7px 12px;border-top:1px solid rgba(255,255,255,.07);font-family:'IBM Plex Mono',monospace;font-size:11px}
.row .n{min-width:26px;font-weight:700;color:var(--gold)}
.row .h{flex:1;min-width:0}
.row .m{color:var(--mu);white-space:nowrap;font-size:10px}
.night{border-left:4px solid #4F46E5}.day{border-left:4px solid #F59E0B}
.lock{position:absolute;inset:0;z-index:5;background:#0B111Ef6;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:24px}
.lock input{background:#070C15;border:1px solid rgba(245,158,11,.5);border-radius:5px;padding:8px 12px;color:#fff;font-family:'IBM Plex Mono',monospace;text-align:center;outline:none;width:210px}
.note{background:#FEF08A;color:#000;font-size:11px;padding:6px 9px;border-radius:4px;margin:4px 0;white-space:pre-wrap}
.banner{background:rgba(229,169,60,.12);border:1px solid rgba(229,169,60,.5);color:#FCD34D;padding:9px 12px;border-radius:8px;font-family:'IBM Plex Mono',monospace;font-size:11px;line-height:1.6;margin-bottom:12px}
.toast{position:fixed;bottom:16px;right:16px;z-index:300;display:flex;flex-direction:column;gap:6px;pointer-events:none}
.toast div{background:#000e;border:1px solid var(--lime);padding:6px 12px;border-radius:5px;font-family:'IBM Plex Mono',monospace;font-size:11px}
@media print{html,body{overflow:auto!important;height:auto!important;background:#fff!important;color:#000!important}.grid,.top,.toast{display:none!important}.ov{position:static;display:block;background:none}.box{border:0;max-height:none;background:#fff}.bb{overflow:visible}*{color:#000!important}}
</style>
<style id="fh-menu-style">
#fh-burger,#fh-sheet,#fh-scrim{display:none;}
@media(max-width:768px){
  .top{gap:8px;padding:0 8px;}
  .tr .sync,.tr > button.tb{display:none!important;}
  .tr .tb[aria-label="Close"]{display:inline-flex!important;width:36px;height:36px;padding:0;justify-content:center;font-size:16px;border-radius:10px;}
  #fh-burger{display:inline-flex;align-items:center;justify-content:center;flex:0 0 36px;width:36px;height:36px;border-radius:10px;border:1px solid var(--line2,#2A3550);background:rgba(255,255,255,.04);color:#E6ECF5;cursor:pointer;padding:0;}
  #fh-burger span{display:block;width:18px;height:2px;background:currentColor;border-radius:1px;box-shadow:0 6px currentColor,0 -6px currentColor;}
  #fh-scrim.on{display:block;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:9998;}
  #fh-sheet.on{display:block;position:fixed;left:0;right:0;bottom:0;z-index:9999;background:#111827;border-top:1px solid #1F2A42;border-radius:16px 16px 0 0;padding:10px 14px calc(14px + env(safe-area-inset-bottom,0px));max-height:85vh;overflow-y:auto;}
  #fh-sheet .g{width:40px;height:4px;border-radius:2px;background:#2A3650;margin:0 auto 12px;}
  #fh-sheet .t{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#7E8FA6;margin:0 0 10px 2px;}
  #fh-sheet button{display:block;width:100%;text-align:left;padding:12px;margin-bottom:5px;border-radius:12px;border:1px solid #1F2A42;background:#0E1320;color:#E6ECF5;font:600 14px system-ui;cursor:pointer;}
  #fh-sheet button small{display:block;font-weight:500;font-size:11px;color:#7E8FA6;margin-top:2px;}
  #fh-sheet button.x{border-color:#7F1D1D;color:#FCA5A5;}
  #fh-sheet .s{font-size:11px;color:#7E8FA6;margin:6px 2px 12px;}
}
</style>
</head>

<script id="sn-cue">
/* Strict character-cue rules shared by every tool (parser, schedule, call sheet, evaluator). */
(function(){
if(window.SNCue)return;
var EXT=/\s*\((?:V\.?O\.?|O\.?S\.?|O\.?C\.?|CONT['’]?D\.?|CONT\.?|CONTINUED|CONTINUING|ON (?:THE )?(?:PHONE|RADIO|TV|SCREEN|SPEAKER|INTERCOM|COMM)|INTO (?:THE )?(?:PHONE|RADIO|MIC)|FILTERED|PRE-?LAP|OFF|OFFSCREEN|SUBTITLED|SUBTITLE|MORE|LIVE|ON MONITOR|ON COMPUTER|ON CELL)\)\s*$/i;
/* sounds, onomatopoeia, camera/direction/time labels, props and screen text that are NOT speakers */
var SFX='BANG|BANGS|BOOM|BOOMS|CRASH|CRASHES|SMASH|SMASHES|SLAM|SLAMS|THUD|THUDS|THUMP|THUMPS|WHACK|WHAM|POW|BAM|BLAM|CLICK|CLICKS|CLACK|CLANG|CLANK|CLINK|CLUNK|CREAK|CREAKS|KNOCK|KNOCKS|KNOCKING|RING|RINGS|RINGING|BEEP|BEEPS|BEEPING|BUZZ|BUZZES|BUZZING|DING|DONG|CHIME|CHIMES|HONK|HONKS|SIREN|SIRENS|ALARM|ALARMS|GUNSHOT|GUNSHOTS|GUNFIRE|SHOT|SHOTS|BLAST|EXPLOSION|EXPLOSIONS|SCREECH|SCREECHES|SQUEAL|SQUEALS|SPLASH|SPLASHES|SPLAT|SPLUTTER|SIZZLE|HISS|HISSES|WHOOSH|WHOOSHES|SWOOSH|ZAP|ZING|THWACK|THWIP|SNAP|SNAPS|CRACK|CRACKS|POP|POPS|CRUNCH|RUMBLE|RUMBLES|ROAR|ROARS|GROWL|GROWLS|BARK|BARKS|BARKING|HOWL|HOWLS|MEOW|WOOF|TICK|TOCK|TICKING|DRIP|DRIPS|WHIR|WHIRR|HUM|HUMS|HUMMING|THROB|STATIC|FEEDBACK|ECHO|ECHOES|SCREAM|SCREAMS|SCREAMING|GASP|GASPS|SOB|SOBS|SIGH|SIGHS|COUGH|COUGHS|LAUGHTER|LAUGHS|APPLAUSE|CHEERS|CHEERING|SILENCE|MUSIC|SONG|SOUND|SOUNDS|NOISE|NOISES|SFX|FX|VFX|SOUND EFFECT|SOUND EFFECTS|ENGINE|ENGINES|THUNDER|LIGHTNING|FLASH|FLASHES|SIGN|TEXT|TITLE|SUPER|SUBTITLE|CAPTION|CHYRON|INSERT|ANGLE|POV|CLOSE|WIDE|PAN|TILT|ZOOM|PUSH|PULL|TRACK|TRACKING|CUT|CUTS|DISSOLVE|FADE|BACK|LATER|EARLIER|MEANWHILE|MORNING|EVENING|AFTERNOON|NIGHT|DAY|DAWN|DUSK|SUNRISE|SUNSET|CONTINUOUS|MOMENTS|SAME|INTERCUT|FLASHBACK|MONTAGE|BEAT|PAUSE|END|CONTINUED|MORE|BLACK|BLACKNESS|DARKNESS|DARK|WHITE|BLANK|OVER|UNDER|NOTE|NOTES|WARNING|DANGER|EXIT|OPEN|CLOSED|STOP|GO|ACTION|CUT TO|HELLO|HELP|LOOK|WATCH|RUN|FREEZE|FIRE|STOP|WAIT|NO|YES|OKAY|OK|WOW|OH|AH|UH|UM|HM|HMM|HA|HAHA|SHH|SHHH|PSST|AAH|AGH|ARGH|UGH|EW|EEK|YIKES|WHOA|HEY|HUH|PHEW|YAY|OOF|OW|OUCH|BRR|GRR|MMM|ER|EH'.split('|');
var SFXSET={};SFX.forEach(function(w){SFXSET[w]=1});
var BAD_START=/^(?:A|AN|AND|OR|BUT|IF|IN|ON|AT|BY|TO|OF|AS|IS|IT|HE|SHE|WE|THEY|HIS|HER|ITS|OUR|THEIR|THIS|THAT|THESE|THOSE|ALL|ANY|SOME|EVERY|NO|NOT|WITH|FROM|INTO|OVER|UNDER|THEN|WHEN|WHILE|SUDDENLY|ANGLE ON|CLOSE ON|CLOSE UP|WIDE ON|BACK TO|CUT TO|SMASH CUT|MATCH CUT|FADE|DISSOLVE|TITLE|SUPER|INSERT|INTERCUT|END OF|THE END|MORE)\b/;
var ABBR=/\b(?:MR|MRS|MS|DR|ST|JR|SR|LT|SGT|CPT|COL|GEN|PROF|CPL|PVT|FR|REV|MAJ|DET|OFC|OFFICER)\.$/;
function strip(s){var p;do{p=s;s=s.replace(EXT,'')}while(s!==p);return s.trim()}
/* returns the cleaned speaker name, or null if this can't be a character */
function name(raw){
  var s=String(raw==null?'':raw).trim();
  if(!s) return null;
  s=s.replace(/^@/,'').replace(/\s*\^$/,'').replace(/^\d+[A-Z]?\.?\s+(?=[A-Z])/,'').trim();
  s=strip(s);
  if(!s||s.length<2||s.length>30) return null;
  if(/[a-z]/.test(s)) return null;                         /* cues are capitals only */
  if(!/^[A-Z][A-Z0-9 '’.\-&#\/]*$/.test(s)) return null;      /* letters, digits, ' . - & # only */
  if(/[!?,:;"“”(){}\[\]<>*_=~|\\]/.test(s)) return null;
  if(/^(?:INT|EXT|EST|I\/E)\b/.test(s)) return null;
  if(/[.]$/.test(s)&&!ABBR.test(s)&&!/(?:\b[A-Z]\.){2,}$/.test(s)) return null;           /* sentences end in a full stop; names don't */
  var ws=s.split(/\s+/).filter(Boolean);
  if(ws.length>4) return null;
  var letters=(s.match(/[A-Z]/g)||[]).length; if(letters<2) return null;
  if(/\d/.test(s)&&!/^[A-Z][A-Z'’.\-& ]*\s#?\d{1,2}$/.test(s)) return null;   /* digits only as a trailing number: GUARD 2 */
  if(/(.)\1{2,}/.test(s.replace(/\s/g,''))) return null;     /* AAAAH, BRRRING */
  if(BAD_START.test(s)&&!/^THE\s+[A-Z]{2,}(?:\s[A-Z]{2,})?$/.test(s)) return null;
  var bare=s.replace(/\s#?\d{1,2}$/,'');
  if(SFXSET[bare]) return null;                            /* whole name is a sound/label */
  for(var i=0;i<ws.length;i++){var w=ws[i].replace(/[^A-Z]/g,''); if(w&&SFXSET[w]&&ws.length>1&&i===ws.length-1&&!/^(?:MR|MRS|DR)$/.test(ws[0])&&!/^(?:KING|QUEEN|SHOT)$/.test(w)) return null; }
  if(ws.length>1&&ws.some(function(w){return /^[A-Z]{4,}ING$/.test(w)})) return null;   /* "DOOR SLAMMING" is action */
  if(ws.length>1&&ws.some(function(w){return SFXSET[w.replace(/[^A-Z]/g,'')]&&/^(?:BANG|BOOM|CRASH|THUD|KNOCK|RING|BEEP|BUZZ|CLICK|GUNSHOT|SIREN|ALARM|EXPLOSION|SCREAM)S?$/.test(w.replace(/[^A-Z]/g,''))})) return null;
  return bare;
}
function typeOf(n){return String(n&&n.type||'').toUpperCase().replace(/-/g,'_')}
/* demote any CHARACTER line that fails the rules or is not followed by dialogue / a parenthetical */
function demote(nodes){
  if(!nodes||!nodes.length) return nodes;
  for(var i=0;i<nodes.length;i++){
    var n=nodes[i]; if(typeOf(n)!=='CHARACTER') continue;
    var nx=nodes[i+1], nt=nx?typeOf(nx):'';
    var ok=name(n.text)!==null&&(nt==='DIALOGUE'||nt==='PARENTHETICAL');
    if(ok&&nt==='PARENTHETICAL'){ var n2=nodes[i+2]; ok=!!n2&&typeOf(n2)==='DIALOGUE'; }
    if(!ok){ n.type=(n.type===n.type.toLowerCase()?'action':'ACTION'); if(n.type==='ACTION'&&n.text===n.text.toUpperCase()&&n.text.length>40) {} }
  }
  return nodes;
}
window.SNCue={name:name,demote:demote,strip:strip};
})();

</script>

/* ---------- script parsing (used when only raw text is stored) ---------- */
function parseText(text){
  var out=[],speaker=false;
  String(text||'').split(/\r?\n/).forEach(function(raw,ix,arr){
    var t=raw.replace(/(^\d+[A-Z]?\s+|\s+\d+[A-Z]?$|^\*\d+\*)/g,'').trim();
    if(!t){speaker=false;return;}
    var ht=t.replace(/^\d+\s+/,''),cl=t.replace(/\s*\((CONT['’]D|V\.O\.|O\.S\.|O\.C\.)\)\s*$/i,'').trim(),type='action';
    if(/^(INT\.|EXT\.|EST\.|INT\/EXT\.|I\/E\.)/i.test(ht)){type='scene-heading';speaker=false;}
    else if(/^\(.*\)$/.test(t)){type='parenthetical';}

}
function normType(t){return String(t||'action').toLowerCase().replace(/_/g,'-');}
function cname(c){return String(c).replace(/\(.*?\)/g,'').trim();}

/* ---------- derive scenes and shoot days from script lines ---------- */
function derive(lines){
  var scenes=[],cur=null,speaker=null;
  lines.forEach(function(l,li){
    var t=(l.text||'').trim();if(!t)return;
    if(l.type==='character'&&window.SNCue){var nx=lines[li+1],nt=nx?nx.type:'';if(SNCue.name(t)===null||!(nt==='dialogue'||nt==='parenthetical')){l.type='action';}}
    if(l.type==='scene-heading'){
      var h=t.replace(/^\d+[A-Z]?\s+/,'').replace(/\s+\d+[A-Z]?$/,'').toUpperCase();
      var m=h.match(/^(INT\.\/EXT\.|INT\/EXT\.|I\/E\.|INT\.|EXT\.|EST\.)\s*(.*?)(?:\s+[-–—]\s+([A-Z][A-Z .\/]*))?$/)||[];
      cur={num:String(scenes.length+1),heading:h,ie:(m[1]||'INT.').replace(/\./g,''),loc:(m[2]||h).trim(),tod:((m[3]||'DAY').trim().split(/\s+/)[0]),cast:[],words:0,lines:[],tags:{},notes:'',omit:false,dlg:{}};
      Object.keys(CATS).forEach(function(k){cur.tags[k]=[];});
      scenes.push(cur);speaker=null;return;
    }
    if(!cur)return;
    cur.lines.push(l);cur.words+=t.split(/\s+/).length;
    if(l.type==='character'){speaker=window.SNCue?(SNCue.name(t)||cname(t)):cname(t);if(cur.cast.indexOf(speaker)<0)cur.cast.push(speaker);}
    else if(l.type==='dialogue'&&speaker){cur.dlg[speaker]=(cur.dlg[speaker]||0)+t.split(/\s+/).length;}
    else if(l.type!=='parenthetical'){speaker=null;}
    if(l.type==='action'||l.type==='dialogue'){
      Object.keys(AUTO).forEach(function(k){(t.match(AUTO[k])||[]).forEach(function(w){w=w.toLowerCase();if(cur.tags[k].indexOf(w)<0)cur.tags[k].push(w);});});
    }
  });
  var cum=0;
  scenes.forEach(function(s){s.eighths=Math.max(1,Math.round(s.words/185*8));s.pg=Math.floor(cum)+1;cum+=s.eighths/8;});

}
function cluster(scenes){
  var live=scenes.filter(function(s){return !s.omit;}).slice().sort(function(a,b){
    return a.loc.localeCompare(b.loc)||((a.tod==='NIGHT')-(b.tod==='NIGHT'))||(+a.num)-(+b.num);});
  var days=[],cur=null;
  live.forEach(function(x){
    if(!cur||cur.eighths+x.eighths>40||(cur.loc!==x.loc&&cur.eighths>=24)){cur={n:days.length+1,loc:x.loc,eighths:0,nums:[],cast:[],needs:{}};days.push(cur);}
    cur.nums.push(x.num);cur.eighths+=x.eighths;

    });
  });

}

/* ---------- build the model from storage ---------- */
function build(){

  else if(pre.scriptText){lines=parseText(pre.scriptText);source='imported script';}
  if(!lines.length&&UI.demo){lines=parseText(SAMPLE);source='demo script';}
  var title=(master&&master.projectName)||pre.projectName||(UI.demo?'STELLAR NURSERY':'UNTITLED PROJECT');
  var ds=derive(lines),scenes=ds,metaUsed=false;

      return {num:m.num,heading:m.heading,ie:m.ie,loc:m.loc,tod:m.tod,cast:m.cast||[],words:m.words,eighths:m.eighths,pg:m.pg,tags:m.tags||{},notes:m.notes||'',omit:!!m.omit,lines:d.lines||[],dlg:d.dlg||{}};});
    Object.keys(CATS).forEach(function(k){scenes.forEach(function(s){s.tags[k]=s.tags[k]||[];});});

  }

  var srcDays=(call&&call.days)||(metaUsed&&meta.days)||null;
  if(srcDays&&metaUsed){days=srcDays.map(function(d){return {n:d.n,loc:d.loc,eighths:d.eighths,nums:(d.scenes||[]).map(function(x){return typeof x==='object'?x.num:x;}),cast:[],needs:{}};});}

  var words=lines.reduce(function(a,l){return a+String(l.text).split(/\s+/).filter(Boolean).length;},0);
  return {title:title,lines:lines,scenes:scenes,days:days,cast:cast,eighths:eighths,pages:Math.max(lines.length?1:0,Math.round(eighths/8*10)/10),words:words,
    source:source,metaUsed:metaUsed,meta:meta,call:call,pre:pre,master:master,
    shots:(function(){var a=J('prehub_shotlist')||[],b=J('prohub_shots_v1')||[],seen={};return a.concat(b).filter(function(x){if(!x||seen[x.id])return false;seen[x.id]=1;return true;});})(),outreach:J('ob_letters')||[],notes:J('prehub_quick_notes')||[],props:J('prohub_props_tracker_v1')||[],ann:J('prohub_scriptation_v1')};
}
function sigNow(){return KEYS.map(function(k){var v=localStorage.getItem(k);return v?v.length:0;}).join('.')+(UI.demo?'d':'');}

var TILES=[
 {id:'scriptin',c:'#A3E635',i:'fa-file-import',t:'Import Script',s:'File or paste: runs every tile',b:function(){return M.lines.length?'LOADED':'START HERE';},dk:1},

}

  h+='<button class="x" data-x="1">&#10005; Close<small>back to the home screen, nothing is deleted</small></button>';
  sh.innerHTML=h; var st=document.getElementById('syncTxt'); var s=document.getElementById('fh-st'); if(s&&st) s.textContent=(document.getElementById('pTitle')||{}).textContent+' \u00b7 '+st.textContent;
  [].forEach.call(sh.querySelectorAll('button'),function(x){ x.onclick=function(){ close(); if(x.getAttribute('data-x')){ location.href='index.html'; return; } var el=items[+x.getAttribute('data-i')]; setTimeout(function(){ el.click(); },60); }; });
  sc.classList.add('on'); sh.classList.add('on'); sh.scrollTop=0;
}
b.onclick=open; sc.onclick=close;
})();
</script>
<script id="fh-import-js">
/* ===== filmHUB: take a script in directly, run the whole pipeline, show every tile ===== */
(function(){
var PDFJS='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js',PDFW='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
function loadPdf(){return new Promise(function(res,rej){if(window.pdfjsLib){res();return;}var s=document.createElement('script');s.src=PDFJS;s.onload=function(){try{pdfjsLib.GlobalWorkerOptions.workerSrc=PDFW;}catch(e){}res();};s.onerror=function(){rej(new Error('PDF reader could not load (needs internet). Paste the text instead, or use a .txt / .fdx / .fountain file.'));};document.head.appendChild(s);});}
function readPDF(file){return loadPdf().then(function(){return file.arrayBuffer();}).then(function(buf){return pdfjsLib.getDocument({data:buf}).promise;}).then(async function(pdf){var acc=[];for(var i=1;i<=pdf.numPages;i++){var pg=await pdf.getPage(i),tc=await pg.getTextContent(),by={};tc.items.forEach(function(it){var y=Math.round(it.transform[5]);(by[y]=by[y]||[]).push({x:it.transform[4],s:it.str});});Object.keys(by).map(Number).sort(function(a,b){return b-a;}).forEach(function(y){var s=by[y].sort(function(a,b){return a.x-b.x;}).map(function(t){return t.s;}).join(' ').trim();if(s)acc.push(s);});acc.push('');}return acc.join('\n');});}
function readFDX(file){return file.text().then(function(t){var x=new DOMParser().parseFromString(t,'text/xml'),acc=[];Array.prototype.forEach.call(x.getElementsByTagName('Paragraph'),function(p){var ty=(p.getAttribute('Type')||'').toLowerCase(),s=Array.prototype.map.call(p.getElementsByTagName('Text'),function(n){return n.textContent;}).join('').trim();if(!s)return;if(ty.indexOf('scene')>=0||ty.indexOf('character')>=0)acc.push(s.toUpperCase());else if(ty.indexOf('parenthetical')>=0)acc.push('('+s.replace(/^\(|\)$/g,'')+')');else acc.push(s);if(ty.indexOf('scene')>=0||ty.indexOf('dialogue')>=0||ty.indexOf('action')>=0||ty.indexOf('transition')>=0)acc.push('');});return acc.join('\n');});}
function readJSON(file){return file.text().then(function(t){var d=JSON.parse(t),l=[];if(d.script&&Array.isArray(d.script.lines))l=d.script.lines;else if(Array.isArray(d.lines))l=d.lines;else if(Array.isArray(d))l=d;return l.map(function(x){return typeof x==='string'?x:(x.value||x.text||'');}).join('\n');});}
function readAny(file){var n=file.name.toLowerCase();if(/\.pdf$/.test(n))return readPDF(file);if(/\.fdx$/.test(n))return readFDX(file);if(/\.json$/.test(n))return readJSON(file);return file.text();}
function titleOf(raw,fallback){var m=String(raw).match(/^\s*Title:\s*(.+)$/im);if(m)return m[1].trim().toUpperCase();return fallback;}
window.fhRun=function(raw,name){
  raw=String(raw||'').replace(/\r/g,'');
  var lines=parseText(raw.replace(/^\s*(Title|Author|Credit|Source|Draft date|Contact):.*$/gim,''));
  var heads=lines.filter(function(l){return l.type==='scene-heading';}).length;
  if(!lines.length||!heads){toast('No scene headings found (INT./EXT.). Check the text and try again.');return false;}
  if(M&&M.lines.length&&!UI.demo&&!confirm('Replace the current project script? The schedule and breakdown will be rebuilt from the new script.'))return false;
  var title=titleOf(raw,(name||'UNTITLED PROJECT').toUpperCase());
  var pre={};try{pre=JSON.parse(localStorage.getItem('prehub_v3')||'{}')||{};}catch(e){}
  pre.projectName=title;pre.scriptText=raw;
  try{
    localStorage.setItem('prehub_v3',JSON.stringify(pre));
    localStorage.setItem('prehub_master_v1',JSON.stringify({origin:'proHUB_parent',projectName:title,lines:lines,ts:Date.now()}));
    ['prohub_meta_v1','prohub_callsheet_v1','prohub_strip_order_v2'].forEach(function(k){localStorage.removeItem(k);});
  }catch(e){toast('Could not save in this browser: '+e.message);return false;}
  UI.demo=false;reload();
  UI.imp={title:title,at:Date.now()};
  UI.cur='scriptin';renderHub();$('ov').classList.add('on');document.body.style.overflow='hidden';
  toast('Imported '+M.scenes.length+' scenes. Every tile is filled in.');
  return true;
};
window.fhPickFile=function(){var i=document.createElement('input');i.type='file';i.accept='.pdf,.fdx,.fountain,.txt,.json,text/plain';
  i.onchange=function(){var f=i.files&&i.files[0];if(!f)return;toast('Reading '+f.name+'...');readAny(f).then(function(t){if(!t||!t.trim()){toast('Could not read any text from '+f.name);return;}window.fhRun(t,f.name.replace(/\.[^.]+$/,''));}).catch(function(e){toast(e.message||'Could not read that file');});};i.click();};
window.fhPasteGo=function(){var t=($('fhPaste')||{}).value||'';if(!t.trim()){toast('Paste the script text first.');return;}window.fhRun(t,($('fhName')||{}).value||'');};
window.fhSample=function(){window.fhRun(SAMPLE,'STELLAR NURSERY');};
H.scriptin=function(){
  var jump=[['script','Script'],['analysis','Script Analysis'],['breakdown','Breakdown'],['strip','Stripboard'],['callsheet','Call Sheets'],['cast','Cast & DOOD'],['needs','Props & Needs'],['locs','Locations'],['shots','Shot List'],['budget','Budget']];
  var res='';
  if(M.lines.length){
    var live=M.scenes.filter(function(s){return !s.omit;});
    res='<div class="banner" style="background:#14301F;border-color:#1F7A4D;color:#CFFAE2">'+(UI.imp?'Imported and processed.':'Current script')+' '+esc(M.title)+': '+M.scenes.length+' scenes, '+M.pages+' pages, '+M.cast.length+' cast, '+M.days.length+' shoot days, '+locList().length+' locations, '+tagCount()+' breakdown items. Everything below is editable in its tile.</div>'+
     cards([['Scenes',M.scenes.length],['Pages',M.pages],['Cast',M.cast.length],['Shoot days',M.days.length],['Locations',locList().length],['Breakdown items',tagCount()]])+
     '<div style="font:700 10px system-ui;letter-spacing:.14em;text-transform:uppercase;color:#8A99B2;margin:14px 0 8px">Open the results</div><div style="display:flex;flex-wrap:wrap;gap:8px">'+jump.map(function(j){return '<button class="btn" style="--c:#A3E635" onclick="openHub(\''+j[0]+'\')">'+j[1]+'</button>';}).join('')+'</div>'+
     '<div style="font:700 10px system-ui;letter-spacing:.14em;text-transform:uppercase;color:#8A99B2;margin:18px 0 8px">Import a different script</div>';
  }
  return {h:M.lines.length?'Script loaded':'Import a script',b:res+
   '<div style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px"><button class="btn on" style="--c:#A3E635;padding:12px 16px;font-size:13px" onclick="fhPickFile()">Choose a file (PDF, FDX, Fountain, TXT)</button><button class="btn" onclick="fhSample()">Try the sample script</button></div>'+
   '<div style="font:700 10px system-ui;letter-spacing:.14em;text-transform:uppercase;color:#8A99B2;margin:6px 0">Or paste the script</div>'+
   '<input id="fhName" placeholder="Project title (optional)" style="width:100%;box-sizing:border-box;margin-bottom:8px;padding:10px;border-radius:6px;border:1px solid #2A3550;background:#0B101C;color:#E6ECF5;font:14px system-ui">'+
   '<textarea id="fhPaste" placeholder="INT. KITCHEN - DAY&#10;&#10;TOM stirs a pot.&#10;&#10;TOM&#10;Smells good." style="width:100%;box-sizing:border-box;min-height:160px;padding:10px;border-radius:6px;border:1px solid #2A3550;background:#0B101C;color:#E6ECF5;font:13px ui-monospace,Menlo,monospace"></textarea>'+
   '<div style="margin-top:8px"><button class="btn on" style="--c:#A3E635;padding:10px 16px;font-size:13px" onclick="fhPasteGo()">Run it</button></div>'+
   '<p style="color:#8A99B2;font-size:12px;margin-top:14px">filmHUB reads the scenes, characters and dialogue, then builds the breakdown, shoot days, call sheets, cast matrix, locations and needs. The script is also saved for preHUB and proHUB, so they pick it up too.</p>'};
};
})();
</script>
