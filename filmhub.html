<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>filmHUB | Production Desk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&family=IBM+Plex+Mono:wght@400;500;700&family=Montserrat:wght@600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="lib/icons.css">
<style>
:root{
  --bg:#060911; --bar:#070C15; --line:#1B2436; --line2:#26344E; --tx:#E9EDF5; --mu:#8794A6; --dim:#4A5A70;
  --lime:#88C13F; --gold:#E5A93C;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100vh;height:100dvh;margin:0;overflow:hidden;background:var(--bg);color:var(--tx);
  font-family:"Segoe UI",-apple-system,BlinkMacSystemFont,"Montserrat",sans-serif;-webkit-font-smoothing:antialiased;}
button{font-family:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;}
a{color:inherit;text-decoration:none;}
:focus-visible{outline:2px solid var(--lime);outline-offset:2px;}
.mono{font-family:'IBM Plex Mono',ui-monospace,monospace;}

/* top bar */
.top{height:44px;display:flex;align-items:center;gap:10px;padding:0 12px;background:var(--bar);border-bottom:1px solid var(--line);}
.logo{font-weight:900;font-size:19px;letter-spacing:-.01em;white-space:nowrap;}
.logo b{color:var(--lime);font-weight:800;text-transform:lowercase;}
.desk{font-size:8.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--gold);background:#382B13;border:1px solid rgba(229,169,60,.6);padding:2px 7px;border-radius:4px;white-space:nowrap;}
.ptitle{font-size:12px;font-weight:900;text-transform:uppercase;letter-spacing:.04em;padding-left:10px;border-left:2px solid var(--lime);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:34vw;}
.psub{font-size:9.5px;font-weight:700;color:var(--mu);letter-spacing:.1em;text-transform:uppercase;white-space:nowrap;}
.tr{margin-left:auto;display:flex;align-items:center;gap:6px;}
.sync{display:flex;align-items:center;gap:6px;font-size:9.5px;background:#0B1322;border:1px solid #1B263B;padding:3px 7px;border-radius:5px;white-space:nowrap;}
.sync i{width:6px;height:6px;border-radius:50%;background:#00E5A3;animation:pa 2s infinite;}
.sync.off i{background:#E5A93C;animation:none;}
@keyframes pa{50%{opacity:.35}}
.tb{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 9px;font-size:9.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
  color:var(--mu);background:#0C1220;border:1px solid var(--line);border-radius:6px;white-space:nowrap;}
.tb:hover{color:#fff;border-color:var(--line2);}
.tb.g{color:var(--gold);background:#382B13;border-color:rgba(229,169,60,.6);}
@media(max-width:768px){.desk,.psub,.tb span,.sync span{display:none}.ptitle{max-width:40vw}}

/* metro grid */
.grid{height:calc(100dvh - 44px);display:grid;grid-template-columns:repeat(4,minmax(0,1fr));grid-template-rows:repeat(6,minmax(0,1fr));
  gap:4px;padding:4px;max-width:1440px;margin:0 auto;overflow:hidden;}
@media(min-width:601px) and (max-width:950px){.grid{grid-template-columns:repeat(6,minmax(0,1fr));grid-template-rows:repeat(5,minmax(0,1fr));gap:6px;padding:6px 8px}}
@media(min-width:951px){.grid{grid-template-columns:repeat(8,minmax(0,1fr));grid-template-rows:repeat(4,minmax(0,1fr));gap:8px;padding:8px 12px}}
.tile{position:relative;cursor:pointer;overflow:hidden;display:flex;flex-direction:column;justify-content:space-between;
  padding:clamp(5px,.8vh,10px);border-radius:3px;box-shadow:0 2px 6px rgba(0,0,0,.6);min-width:0;min-height:0;color:#fff;
  transition:transform .1s,filter .1s;user-select:none;}
.tile:hover{transform:scale(.99);filter:brightness(1.08)} .tile:active{transform:scale(.97)}
.tile.dk{color:#000}
.t1{grid-column:span 1;grid-row:span 1}
.tw{grid-column:span 4;grid-row:span 2}
.tt{display:flex;justify-content:space-between;align-items:flex-start;gap:4px}
.ti{font-size:clamp(16px,2.8vh,28px);line-height:1}
.tbadge{font-family:'IBM Plex Mono',monospace;font-size:clamp(6.5px,.9vh,9px);font-weight:700;letter-spacing:.04em;text-transform:uppercase;
  padding:1px 4px;border-radius:2px;background:rgba(0,0,0,.38);white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis;}
.dk .tbadge{background:rgba(0,0,0,.2)}
.tname{font-size:clamp(7.5px,1.1vh,11px);font-weight:800;letter-spacing:.02em;text-transform:uppercase;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.tsub{font-size:clamp(6.5px,.9vh,9px);font-weight:600;opacity:.85;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

/* hero */
.hero{background:#F0A30A;color:#000}
.hero .r1{display:flex;justify-content:space-between;align-items:flex-start;gap:6px}
.hero .ph{display:inline-block;background:rgba(0,0,0,.15);padding:1px 5px;border-radius:3px;font-family:'IBM Plex Mono',monospace;font-size:clamp(7px,1vh,9.5px);font-weight:700;text-transform:uppercase}
.hero .wx{font-size:clamp(8.5px,1.3vh,12px);font-weight:900;text-transform:uppercase;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.clock{font-family:'Courier Prime',monospace;font-weight:700;font-size:clamp(1.1rem,3vh,2.4rem);line-height:.9;letter-spacing:-.02em;white-space:nowrap}
.clock small{font-size:.4em;margin-left:2px}
.hero .cur{background:rgba(0,0,0,.14);border:1px solid rgba(0,0,0,.2);border-radius:3px;padding:3px 6px;overflow:hidden}
.hero .cur .a{display:flex;justify-content:space-between;font-family:'IBM Plex Mono',monospace;font-size:clamp(6.5px,.9vh,9px);font-weight:700;text-transform:uppercase}
.hero .cur .b{font-family:'IBM Plex Mono',monospace;font-weight:700;font-size:clamp(8.5px,1.3vh,12px);text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hero .st{display:grid;grid-template-columns:repeat(6,1fr);background:rgba(0,0,0,.14);border:1px solid rgba(0,0,0,.15);border-radius:3px;padding:2px 0}
.hero .st div{text-align:center;border-right:1px solid rgba(0,0,0,.2);min-width:0;font-family:'IBM Plex Mono',monospace}
.hero .st div:last-child{border:0}
.hero .st span{display:block;font-size:clamp(5.5px,.8vh,8px);opacity:.75}
.hero .st b{font-size:clamp(8px,1.3vh,13px);font-weight:700}

/* hub overlay */
.ov{position:fixed;inset:0;z-index:100;display:none;background:rgba(4,7,14,.94);backdrop-filter:blur(8px);justify-content:center;align-items:flex-start;overflow-y:auto}
.ov.on{display:flex}
.box{width:100%;max-width:1040px;min-height:100vh;background:#0B111E;display:flex;flex-direction:column;animation:pop .18s ease-out}
@media(min-width:768px){.ov{padding:28px 16px}.box{min-height:0;max-height:calc(100vh - 56px);border:1px solid rgba(255,255,255,.15);border-radius:12px;box-shadow:0 20px 45px rgba(0,0,0,.85);overflow:hidden}}
@keyframes pop{from{transform:scale(.97);opacity:0}to{transform:none;opacity:1}}
.bh{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:14px 18px 10px;border-bottom:1px solid rgba(255,255,255,.18);flex-shrink:0}
.bh .k{font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.bh h2{margin:2px 0 0;font-size:21px;font-weight:700;letter-spacing:-.01em}
.bh .acts{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.bb{padding:14px 18px 22px;overflow-y:auto;flex:1;min-height:0}
.btn{padding:6px 11px;font-size:11px;font-weight:700;border-radius:5px;background:rgba(255,255,255,.1);color:#fff}
.btn:hover{background:rgba(255,255,255,.2)}
.btn.on{background:var(--c,#00ABA9);color:#000}
.btn.red{background:#B91C1C}.btn.red:hover{background:#DC2626}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-bottom:14px}
.card{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:8px;padding:9px 10px}
.card .l{font-family:'IBM Plex Mono',monospace;font-size:9.5px;color:var(--mu);text-transform:uppercase;letter-spacing:.06em}
.card .v{font-size:19px;font-weight:800;margin-top:2px;font-family:'IBM Plex Mono',monospace}
.card .s{font-size:10px;color:var(--mu);margin-top:2px}
.sec{font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;margin:16px 0 8px;display:flex;align-items:center;gap:8px}
.sec::after{content:"";flex:1;height:1px;background:rgba(255,255,255,.1)}
.tw2{overflow-x:auto;border:1px solid rgba(255,255,255,.08);border-radius:8px}
table{width:100%;border-collapse:collapse;font-family:'IBM Plex Mono',monospace;font-size:11px;min-width:520px}
th{background:rgba(255,255,255,.08);text-transform:uppercase;font-size:9.5px;text-align:left;padding:7px 8px;white-space:nowrap;letter-spacing:.04em}
td{padding:6px 8px;border-top:1px solid rgba(255,255,255,.07);vertical-align:top}
tr:hover td{background:rgba(255,255,255,.03)}
.pill{display:inline-block;padding:1px 6px;border-radius:9px;font-size:9.5px;font-weight:700;border:1px solid currentColor;margin:1px 2px 1px 0;white-space:nowrap}
.bar{height:6px;background:rgba(255,255,255,.1);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--c,#00ABA9)}
.empty{padding:38px 12px;text-align:center;color:var(--mu);font-family:'IBM Plex Mono',monospace;font-size:12px;line-height:1.8}
.script{background:#000a;border:1px solid rgba(255,255,255,.1);border-radius:8px;padding:16px;font-family:'Courier Prime',monospace;font-size:13px;line-height:1.45;max-height:60vh;overflow-y:auto}
.script .sh{font-weight:700;text-transform:uppercase;margin:14px 0 6px}
.script .ac{margin:6px 0}
.script .ch{margin:10px 0 0 38%;font-weight:700;text-transform:uppercase}
.script .pa{margin-left:30%;font-style:italic;color:#9CA3AF}
.script .dl{margin:0 18% 0 24%}
.script .tr2{text-align:right;font-weight:700;margin:8px 0}
.daybox{border:1px solid rgba(255,255,255,.1);border-radius:8px;margin-bottom:12px;overflow:hidden}
.dayh{padding:8px 12px;background:rgba(255,255,255,.07);font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:700;text-transform:uppercase;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.row{display:flex;gap:10px;align-items:center;padding:7px 12px;border-top:1px solid rgba(255,255,255,.07);font-family:'IBM Plex Mono',monospace;font-size:11px}
.row .n{min-width:26px;font-weight:700;color:var(--gold)}
.row .h{flex:1;min-width:0}
.row .m{color:var(--mu);white-space:nowrap;font-size:10px}
.night{border-left:4px solid #4F46E5}.day{border-left:4px solid #F59E0B}
.lock{position:absolute;inset:0;z-index:5;background:#0B111Ef6;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:24px}
.lock input{background:#070C15;border:1px solid rgba(245,158,11,.5);border-radius:5px;padding:8px 12px;color:#fff;font-family:'IBM Plex Mono',monospace;text-align:center;outline:none;width:210px}
.note{background:#FEF08A;color:#000;font-size:11px;padding:6px 9px;border-radius:4px;margin:4px 0;white-space:pre-wrap}
.banner{background:rgba(229,169,60,.12);border:1px solid rgba(229,169,60,.5);color:#FCD34D;padding:9px 12px;border-radius:8px;font-family:'IBM Plex Mono',monospace;font-size:11px;line-height:1.6;margin-bottom:12px}
.toast{position:fixed;bottom:16px;right:16px;z-index:300;display:flex;flex-direction:column;gap:6px;pointer-events:none}
.toast div{background:#000e;border:1px solid var(--lime);padding:6px 12px;border-radius:5px;font-family:'IBM Plex Mono',monospace;font-size:11px}
@media print{html,body{overflow:auto!important;height:auto!important;background:#fff!important;color:#000!important}.grid,.top,.toast{display:none!important}.ov{position:static;display:block;background:none}.box{border:0;max-height:none;background:#fff}.bb{overflow:visible}*{color:#000!important}}
</style>
<style id="fh-menu-style">
#fh-burger,#fh-sheet,#fh-scrim{display:none;}
@media(max-width:768px){
  .top{gap:8px;padding:0 8px;}
  .tr .sync,.tr > button.tb{display:none!important;}
  .tr .tb[aria-label="Close"]{display:inline-flex!important;width:36px;height:36px;padding:0;justify-content:center;font-size:16px;border-radius:10px;}
  #fh-burger{display:inline-flex;align-items:center;justify-content:center;flex:0 0 36px;width:36px;height:36px;border-radius:10px;border:1px solid var(--line2,#2A3550);background:rgba(255,255,255,.04);color:#E6ECF5;cursor:pointer;padding:0;}
  #fh-burger span{display:block;width:18px;height:2px;background:currentColor;border-radius:1px;box-shadow:0 6px currentColor,0 -6px currentColor;}
  #fh-scrim.on{display:block;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:9998;}
  #fh-sheet.on{display:block;position:fixed;left:0;right:0;bottom:0;z-index:9999;background:#111827;border-top:1px solid #1F2A42;border-radius:16px 16px 0 0;padding:10px 14px calc(14px + env(safe-area-inset-bottom,0px));max-height:85vh;overflow-y:auto;}
  #fh-sheet .g{width:40px;height:4px;border-radius:2px;background:#2A3650;margin:0 auto 12px;}
  #fh-sheet .t{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#7E8FA6;margin:0 0 10px 2px;}
  #fh-sheet button{display:block;width:100%;text-align:left;padding:12px;margin-bottom:5px;border-radius:12px;border:1px solid #1F2A42;background:#0E1320;color:#E6ECF5;font:600 14px system-ui;cursor:pointer;}
  #fh-sheet button small{display:block;font-weight:500;font-size:11px;color:#7E8FA6;margin-top:2px;}
  #fh-sheet button.x{border-color:#7F1D1D;color:#FCA5A5;}
  #fh-sheet .s{font-size:11px;color:#7E8FA6;margin:6px 2px 12px;}
}
</style>

<body>
<script src="lib/screenplay.js"></script>


<header class="top">
  <div class="logo"><b>film</b>HUB</div>
  <span class="ptitle" id="pTitle">UNTITLED PROJECT</span>
  <span class="psub" id="pSub"></span>
  <div class="tr">
    <button class="tb g" id="fhImportBtn" onclick="openHub('scriptin')" title="Import a script (file or paste). filmHUB parses it and fills every tile."><i class="fa-solid fa-file-import"></i><span>Import script</span></button>
    <div class="sync" id="syncPill"><i></i><span class="mono" id="syncTxt">Live link</span></div>
    <button class="tb" onclick="reload(true)" title="Re-read preHUB and proHUB data"><i class="fa-solid fa-rotate"></i><span>Refresh</span></button>
    <button class="tb" id="saveAllBtn" onclick="SNMaster.save()" title="Save everything (all tools) to one JSON file"><i class="fa-solid fa-floppy-disk"></i><span>Save all</span></button>
    <button class="tb" id="phOnsetBtn" onclick="window.PHOnset&&PHOnset.open()" title="Phone-friendly view of today: scenes, calls, location"><i class="fa-solid fa-clapperboard"></i><span>On set</span></button>
    <button class="tb" id="phShareBtn" onclick="window.PHOnset&&PHOnset.share()" title="Make a read-only call sheet link"><i class="fa-solid fa-share-nodes"></i><span>Share link</span></button>
    <button class="tb" id="phExportBtn" onclick="window.PHX&&PHX.open()" title="Export spreadsheets, calendar, Fountain and FDX files"><i class="fa-solid fa-file-export"></i><span>Export data</span></button>
    <button class="tb" id="phBackupBtn" onclick="window.PHSafety&&PHSafety.open()" title="Automatic snapshots, restore and folder auto-save"><i class="fa-solid fa-clock-rotate-left"></i><span>Backups</span></button>
    <button class="tb" onclick="hubImport()" title="Import a master JSON or a client/backup HTML file"><i class="fa-solid fa-folder-open"></i><span>Load backup</span></button>
    <button class="tb g" onclick="clientExport(false)" title="Download a self-contained presentation website (HTML) for a client"><i class="fa-solid fa-display"></i><span>Client site</span></button>
    <button class="tb" onclick="clientExport(true)" title="Client site plus an embedded full backup that can be re-imported"><i class="fa-solid fa-box-open"></i><span>Site + backup</span></button>
    <button class="tb g" onclick="exportPackage()" title="Download everything as one JSON package"><i class="fa-solid fa-box-archive"></i><span>Package</span></button>
    <a class="tb" aria-label="Close" href="index.html" title="Close and return to the home screen. Nothing is deleted." style="color:#FCA5A5;border-color:#7F1D1D;white-space:nowrap">&#10005;</a>
  </div>
</header>

<main class="grid" id="grid"></main>

<div class="ov" id="ov"><div class="box" id="box" style="position:relative">
  <div class="bh" id="bh"></div>
  <div class="bb" id="bb"></div>
</div></div>
<div class="toast" id="toast"></div>

<script>
/* ======================================================================
   filmHUB: reads what preHUB and proHUB already save in this browser and
   shows it as one organized desk. Nothing here writes back to those hubs.
   Keys read: prehub_master_v1, prehub_v3, prohub_meta_v1, prohub_scriptation_v1,
   prohub_callsheet_v1, prehub_shotlist, prohub_props_tracker_v1, ob_letters,
   prehub_quick_notes.
   ====================================================================== */
'use strict';
var KEYS=['prehub_master_v1','prehub_v3','prohub_meta_v1','prohub_scriptation_v1','prohub_callsheet_v1','prehub_shotlist','prohub_shots_v1','prohub_props_tracker_v1','ob_letters','prehub_quick_notes'];
var CATS={prop:['Props','#60A5FA'],vehicle:['Vehicles','#F59E0B'],wardrobe:['Wardrobe','#F472B6'],sfx:['SFX','#F87171'],stunt:['Stunts','#FB923C'],extra:['Extras','#A78BFA'],animal:['Animals','#4ADE80'],vfx:['VFX','#22D3EE'],sound:['Sound','#FCD34D'],mu:['Makeup','#E879F9']};
var AUTO=window.PH_AUTO||{prop:/\b(cleaver|knife|gun|phone|letter|photo|bottle|key|bag|lantern|flashlight|radio|book|camera|lipstick|badge|lanyard)s?\b/gi,vehicle:/\b(car|sedan|truck|van|motorcycle|bike|helicopter|boat|mustang)s?\b/gi,animal:/\b(dog|cat|horse|bird)s?\b/gi,sfx:/\b(explosion|fire|smoke|rain|blood|gunshot|shatters?)\b/gi,stunt:/\b(fight|leaps?|falls?|punch(es)?|tackles?|chase[sd]?|crash(es)?|charges)\b/gi,vfx:/\b(searchlights?|hologram|glow(s|ing)?|membrane)\b/gi,extra:/\b(crowd|onlookers|patrons|passersby)\b/gi,sound:/\b(music|song|siren|alarm|echo)\b/gi,wardrobe:/\b(coat|uniform|dress|jacket|hat|robe|apron|nightgown)s?\b/gi};
var SAMPLE="1 EXT. HOUSE / CARPORT - NIGHT 1\n\nSweeping searchlights spin across the yard. In the distance, the dog barks.\nINGRID charges off the porch, heavy steel butcher cleaver raised high.\n\nINGRID\n(whispering)\nLotus, stay with me.\n\n2 INT. 1989 FORD MUSTANG - CONTINUOUS 2\n\nIngrid dives inside the car. She twists the ignition key. The V8 ENGINE ROARS to life.\nShe throws it in reverse!\n\n3 INT. INTERROGATION ROOM - DAY\n\nA pool of light beams down onto a two-cushion couch. INGRID lies flat.\n\nINGRID\nLotus!\n\nTHERAPIST (O.S.)\nThe transition can be disorienting.";
var UI={day:1,script:'all',shotF:'all',bud:true,cur:null,demo:false,sig:''};
var M=null;

function $(i){return document.getElementById(i);}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function J(k){try{return JSON.parse(localStorage.getItem(k)||'null');}catch(e){return null;}}
function toast(m){var d=document.createElement('div');d.textContent=m;$('toast').appendChild(d);setTimeout(function(){d.remove();},2400);}
function money(n){return '$'+Math.round(n).toLocaleString();}
function hhmm(m){m=Math.round(m);var h=Math.floor(m/60)%24,x=m%60;return (h<10?'0':'')+h+':'+(x<10?'0':'')+x;}
function pill(t,c){return '<span class="pill" style="color:'+c+'">'+esc(t)+'</span>';}

/* ---------- script parsing (used when only raw text is stored) ---------- */
var parseText=PHScript.parseText,normType=PHScript.normType,cname=PHScript.cname;
/* ---------- derive scenes and shoot days from script lines ---------- */
var derive=PHScript.derive;
function cluster(scenes){
  var live=scenes.filter(function(s){return !s.omit;}).slice().sort(function(a,b){
    return a.loc.localeCompare(b.loc)||((a.tod==='NIGHT')-(b.tod==='NIGHT'))||(parseInt(a.num,10)||0)-(parseInt(b.num,10)||0)||String(a.num).localeCompare(String(b.num));});
  var days=[],cur=null;
  live.forEach(function(x){
    if(!cur||cur.eighths+x.eighths>40||(cur.loc!==x.loc&&cur.eighths>=24)){cur={n:days.length+1,loc:x.loc,eighths:0,nums:[],cast:[],needs:{}};days.push(cur);}
    cur.nums.push(x.num);cur.eighths+=x.eighths;
  });
  return days;
}
function finishDays(days,scenes){
  var by={};scenes.forEach(function(s){by[s.num]=s;});
  days.forEach(function(d){
    d.cast=[];d.needs={};
    d.nums.forEach(function(n){var s=by[n];if(!s)return;
      s.cast.forEach(function(c){if(d.cast.indexOf(c)<0)d.cast.push(c);});
      Object.keys(CATS).forEach(function(k){(s.tags[k]||[]).forEach(function(w){d.needs[k]=d.needs[k]||[];if(d.needs[k].indexOf(w)<0)d.needs[k].push(w);});});
    });
  });
  return days;
}

/* ---------- build the model from storage ---------- */
function build(){
  var master=J('prehub_master_v1'),pre=J('prehub_v3')||{},meta=J('prohub_meta_v1'),call=J('prohub_callsheet_v1');
  var lines=[],source='none';
  if(master&&master.lines&&master.lines.length){lines=master.lines.map(function(l){var x={type:normType(l.type),text:String(l.text||'')};if(l.sn)x.sn=String(l.sn);if(l.om)x.om=1;if(l.rv)x.rv=1;return x;});source='preHUB transmit';}
  else if(pre.scriptText){lines=parseText(pre.scriptText);source='imported script';}
  if(!lines.length&&UI.demo){lines=parseText(SAMPLE);source='demo script';}
  var title=(master&&master.projectName)||pre.projectName||(UI.demo?'STELLAR NURSERY':'UNTITLED PROJECT');
  var ds=derive(lines),scenes=ds,metaUsed=false;
  if(meta&&meta.scenes&&ds.length&&meta.scenes.length===ds.length){
    var dm={},nm={};ds.forEach(function(s,i){dm[s.num]=s;});
    scenes=meta.scenes.map(function(m,i){var d=ds[i]||dm[m.num]||{};nm[m.num]=d.num||m.num;
      return {num:d.num||m.num,heading:m.heading,ie:m.ie,loc:m.loc,tod:m.tod,cast:m.cast||[],words:m.words,eighths:m.eighths,pg:m.pg,tags:m.tags||{},notes:m.notes||'',omit:!!m.omit||!!d.omit,lines:d.lines||[],dlg:d.dlg||{}};});
    Object.keys(CATS).forEach(function(k){scenes.forEach(function(s){s.tags[k]=s.tags[k]||[];});});
    metaUsed=true;
  }
  if(!metaUsed){var st0=J('prohub_scriptation_v1')||{};scenes.forEach(function(s){(st0.ann||[]).forEach(function(a){if(String(a.scene)===String(s.num)&&s.tags[a.cat]){var w=String(a.text).toLowerCase();if(s.tags[a.cat].indexOf(w)<0)s.tags[a.cat].push(w);}});if(st0.notes&&st0.notes[s.num])s.notes=st0.notes[s.num];if(st0.omit&&st0.omit[s.num])s.omit=true;});}
  var days;
  var srcDays=(call&&call.days)||(metaUsed&&meta.days)||null;
  if(srcDays&&metaUsed){days=srcDays.map(function(d){return {n:d.n,loc:d.loc,eighths:d.eighths,nums:(d.scenes||[]).map(function(x){x=typeof x==='object'?x.num:x;return (typeof nm!=='undefined'&&nm[x])||x;}),cast:[],needs:{}};});}
  else days=cluster(scenes);
  var drift=null;
  if(srcDays&&metaUsed){
    var known={},placed={},byNum={};scenes.forEach(function(x){known[x.num]=1;byNum[x.num]=x;});
    var gone=[],added=[];
    days.forEach(function(d){d.nums=d.nums.filter(function(q){var ok=known[q]&&!byNum[q].omit&&!placed[q];if(!ok&&!placed[q])gone.push(q);if(ok)placed[q]=1;return ok;});});
    var open=scenes.filter(function(x){return !x.omit&&!placed[x.num];});
    if(days.length&&open.length){open.forEach(function(x){var tgt=null;days.forEach(function(d){if(d.loc===x.loc)tgt=d;});tgt=tgt||days[days.length-1];tgt.nums.push(x.num);placed[x.num]=1;added.push(x.num);});}
    days.forEach(function(d){d.eighths=d.nums.reduce(function(a,q){return a+((byNum[q]||{}).eighths||0);},0);});
    days=days.filter(function(d){return d.nums.length;});
    if(gone.length||added.length)drift={removed:gone,added:added};
  }
  days=finishDays(days,scenes);
  var cast=[];scenes.forEach(function(s){s.cast.forEach(function(c){if(cast.indexOf(c)<0)cast.push(c);});});
  var eighths=scenes.reduce(function(a,s){return a+(s.omit?0:s.eighths);},0);
  var words=lines.reduce(function(a,l){return a+String(l.text).split(/\s+/).filter(Boolean).length;},0);
  return {drift:drift,title:title,lines:lines,scenes:scenes,days:days,cast:cast,eighths:eighths,pages:Math.max(lines.length?1:0,Math.round(eighths/8*10)/10),words:words,
    source:source,rev:(master&&master.shoot)||null,metaUsed:metaUsed,meta:meta,call:call,pre:pre,master:master,
    shots:(function(){var a=J('prehub_shotlist')||[],b=J('prohub_shots_v1')||[],seen={};return a.concat(b).filter(function(x){if(!x||seen[x.id])return false;seen[x.id]=1;return true;});})(),outreach:J('ob_letters')||[],notes:J('prehub_quick_notes')||[],props:J('prohub_props_tracker_v1')||[],ann:J('prohub_scriptation_v1')};
}

}

  var lines=parseText(raw.replace(/^\s*(Title|Author|Credit|Source|Draft date|Contact):.*$/gim,''));
  var heads=lines.filter(function(l){return l.type==='scene-heading';}).length;
  if(!lines.length||!heads){toast('No scene headings found (INT./EXT.). Check the text and try again.');return false;}
  if(M&&M.lines.length&&!UI.demo&&!confirm('Replace the current project script? The schedule and breakdown will be rebuilt from the new script.'))return false;
  var title=titleOf(raw,(name||'UNTITLED PROJECT').toUpperCase());
  var pre={};try{pre=JSON.parse(localStorage.getItem('prehub_v3')||'{}')||{};}catch(e){}
  pre.projectName=title;pre.scriptText=raw;
  try{
    localStorage.setItem('prehub_v3',JSON.stringify(pre));
    localStorage.setItem('prehub_master_v1',JSON.stringify({origin:'proHUB_parent',projectName:title,lines:lines,ts:Date.now()}));
    ['prohub_meta_v1','prohub_callsheet_v1','prohub_strip_order_v2'].forEach(function(k){localStorage.removeItem(k);});
  }catch(e){toast('Could not save in this browser: '+e.message);return false;}
  UI.demo=false;reload();
  UI.imp={title:title,at:Date.now()};
  UI.cur='scriptin';renderHub();$('ov').classList.add('on');document.body.style.overflow='hidden';
  toast('Imported '+M.scenes.length+' scenes. Every tile is filled in.');
  return true;
};

  i.onchange=function(){var f=i.files&&i.files[0];if(!f)return;toast('Reading '+f.name+'...');readAny(f).then(function(t){if(!t||!t.trim()){toast('Could not read any text from '+f.name);return;}window.fhRun(t,f.name.replace(/\.[^.]+$/,''));}).catch(function(e){toast(e.message||'Could not read that file');});};i.click();};

};

/* ===== filmHUB production data: info, crew, cast contacts, call-sheet day setup,
   weather / nearest hospital / vendor lookups (Open-Meteo, OpenStreetMap) ===== */
var PCK='filmhub_prod_v1',PC={};
if(KEYS.indexOf(PCK)<0)KEYS.push(PCK);
function pcLoad(){PC=J(PCK)||{};PC.info=PC.info||{};PC.crew=PC.crew||[];PC.cast=PC.cast||{};PC.days=PC.days||{};PC.vendors=PC.vendors||[];PC.print=PC.print||{};PC.print.presets=PC.print.presets||{};PC.print.o=PC.print.o||{};}
function pcSave(){try{localStorage.setItem(PCK,JSON.stringify(PC));}catch(e){toast('Storage is full. Remove the logo or some images.');}}
pcLoad();
function pcDay(n){return PC.days[n]||(PC.days[n]={});}
function pp(){return Array.prototype.map.call(arguments,function(s){return encodeURIComponent(s).replace(/'/g,'%27');}).join('|');}
function pcSet(path,val){
  var seg=path.split('|').map(decodeURIComponent),o=PC;
  for(var i=0;i<seg.length-1;i++){if(o[seg[i]]==null)o[seg[i]]={};o=o[seg[i]];}
  o[seg[seg.length-1]]=val;pcSave();
  if(seg[0]==='days'&&(seg[2]==='date'||seg[2]==='address'))pcAuto(+seg[1],true);
}
function pcIso(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function pcStart(){return PC.info.startDate||((J('prohub_schedule_v1')||{}).start)||'';}
function pcDate(n){
  var d0=PC.days[n]&&PC.days[n].date;if(d0)return d0;var s=pcStart();if(!s)return '';
  var d=new Date(s+'T12:00:00'),k=0;while(d.getDay()===0||d.getDay()===6)d.setDate(d.getDate()+1);
  while(k<n-1){d.setDate(d.getDate()+1);var g=d.getDay();if(g!==0&&g!==6)k++;}return pcIso(d);
}

  var dd=pcDay(n),g=t2m(dd.general||PC.info.generalCall||'07:00'),cr=t2m(dd.crewCall)!=null?t2m(dd.crewCall):g,sh=t2m(dd.shootCall)!=null?t2m(dd.shootCall):g+60;
  return {general:g,crew:cr,shoot:sh,lunchSet:t2m(dd.lunch)};

  var T=pcTimes(d.n),t=T.shoot,out=[],worked=0,ate=false,lunchAt=T.lunchSet;
  d.nums.map(sceneBy).filter(Boolean).forEach(function(s){
    if(!ate&&((lunchAt!=null&&t>=lunchAt)||(lunchAt==null&&worked>=360))){out.push({meal:1,a:t,b:t+30});t+=30;ate=true;worked=0;}
    var dur=Math.max(30,s.eighths*15);out.push({s:s,a:t,b:t+dur});t+=dur;worked+=dur;});
  return {rows:out,end:t,T:T};

  return w.map(function(x,i){return x?(i===f&&i===l?'SWF':i===f?'SW':i===l?'WF':'W'):(f>=0&&i>f&&i<l?'H':'');});}

function getJ(url,opt){
  var c=typeof AbortController!=='undefined'?new AbortController():null,t=setTimeout(function(){if(c)c.abort();},(opt&&opt.ms)||22000);
  var o=opt&&opt.body?{method:'POST',body:opt.body,headers:{'Content-Type':'application/x-www-form-urlencoded'}}:{};if(c)o.signal=c.signal;
  return fetch(url,o).then(function(r){clearTimeout(t);if(!r.ok)throw new Error('HTTP '+r.status);return r.json();},function(e){clearTimeout(t);throw e;});
}
function geocode(q){
  return getJ('https://nominatim.openstreetmap.org/search?format=jsonv2&limit=6&q='+encodeURIComponent(q)).then(function(a){
    return (a||[]).map(function(x){return {lat:+x.lat,lon:+x.lon,label:x.display_name};});
  }).catch(function(){
    return getJ('https://geocoding-api.open-meteo.com/v1/search?count=6&name='+encodeURIComponent(q.split(',')[0])).then(function(r){
      return ((r&&r.results)||[]).map(function(x){return {lat:x.latitude,lon:x.longitude,label:[x.name,x.admin1,x.country].filter(Boolean).join(', ')};});});
  });
}
function overpass(q){

  function go(){return getJ(eps[i],{body:'data='+encodeURIComponent(q),ms:28000}).catch(function(e){i++;if(i<eps.length)return go();throw e;});}
  return go();
}
function osmAddr(t){
  var a=[[t['addr:housenumber'],t['addr:street']].filter(Boolean).join(' '),t['addr:city'],[t['addr:state'],t['addr:postcode']].filter(Boolean).join(' ')].filter(Boolean).join(', ');
  return a;
}
function osmItem(e,lat,lon){
  var t=e.tags||{},la=e.lat!=null?e.lat:(e.center&&e.center.lat),lo=e.lon!=null?e.lon:(e.center&&e.center.lon);if(la==null||!t.name)return null;
  return {id:e.type+e.id,name:t.name,address:osmAddr(t),phone:t.phone||t['contact:phone']||'',website:t.website||t['contact:website']||'',hours:t.opening_hours||'',

function fetchWeather(g,date){
  var today=pcIso(new Date()),far=date&&((new Date(date+'T12:00:00')-new Date(today+'T12:00:00'))/864e5);
  var inWin=date&&far>=0&&far<=15;

  return getJ(url).then(function(r){
    var d=r.daily||{};if(!d.time||!d.time.length)throw new Error('no data');
    return {forDate:d.time[0],requested:date||'',exact:!!inWin,code:d.weather_code[0],desc:WMO[d.weather_code[0]]||'',hi:Math.round(d.temperature_2m_max[0]),lo:Math.round(d.temperature_2m_min[0]),
      pop:d.precipitation_probability_max[0],wind:Math.round(d.wind_speed_10m_max[0]),sunrise:String(d.sunrise[0]).slice(11,16),sunset:String(d.sunset[0]).slice(11,16),fetched:Date.now(),geoKey:pcGeoKey(g)};

function fetchHospitals(g){
  var radii=[15000,40000,100000],i=0;
  function go(){
    var q='[out:json][timeout:25];(nwr["amenity"="hospital"](around:'+radii[i]+','+g.lat+','+g.lon+'););out center tags 40;';
    return overpass(q).then(function(r){
      var a=(r.elements||[]).map(function(e){return osmItem(e,g.lat,g.lon);}).filter(Boolean).sort(function(x,y){return x.mi-y.mi;});
      if(!a.length&&++i<radii.length)return go();return a;});

var AUTO_BUSY={};
function pcAuto(n,force){
  var dd=pcDay(n),g=dd.geo;if(!g||!navigator.onLine)return Promise.resolve();
  var gk=pcGeoKey(g),date=pcDate(n),jobs=[];
  var w=dd.weather;
  if(force||!w||w.geoKey!==gk||(w.requested||'')!==(date||'')||Date.now()-w.fetched>3*3600*1000){
    if(!AUTO_BUSY['w'+n]){AUTO_BUSY['w'+n]=1;pcPaintWx(n,'Looking up forecast…');
      jobs.push(fetchWeather(g,date).then(function(x){dd.weather=x;pcSave();},function(){dd.weatherErr=1;}).then(function(){AUTO_BUSY['w'+n]=0;pcPaintWx(n);}));}
  }
  var h=dd.hospital;
  if(!(h&&h.manual)&&(force==='hosp'||!h||h.geoKey!==gk)){
    if(!AUTO_BUSY['h'+n]){AUTO_BUSY['h'+n]=1;pcPaintHosp(n,'Finding the nearest hospital…');
      jobs.push(fetchHospitals(g).then(function(a){
        if(!a.length){dd.hospital={name:'',geoKey:gk,none:1};}
        else{var near=a[0],er=a.filter(function(x){return x.er;})[0];var best=(er&&er.mi<=near.mi*1.6+2)?er:near;
          dd.hospital={name:best.name,address:best.address,phone:best.phone,lat:best.lat,lon:best.lon,mi:best.mi,er:best.er,geoKey:gk,alts:a.slice(0,6),fetched:Date.now()};}
        pcSave();},function(){dd.hospital=dd.hospital||{name:'',geoKey:'',err:1};dd.hospital.err=1;}).then(function(){AUTO_BUSY['h'+n]=0;pcPaintHosp(n);}));}
  }
  return Promise.all(jobs);
}

function pcCalendar(bd){

/* ---- screenplay pages (shooting script + sides) ---- */
function cap(s){s=String(s||'').toLowerCase();return s.charAt(0).toUpperCase()+s.slice(1);}
function scriptPages(D,scenes,o){
  var X=(D.pg.w-612)/2+108,W=432,sz=+o.size||12,lh=sz,om={t:D.m.t,b:D.m.b,nf:D.noFooter},TOP=72,curNum=null,tY=TOP;
  D.m.t=TOP;D.m.b=60;D.noFooter=true;var pgNo=0,revLbl=o.revLabel||'',PH=(o.rev&&window.PHRev)?window.PHRev:null,PGS=[],LK=PH?PH.lockInfo():null,lpi=0,seenN={};
  function chrome(){pgNo++;
    if(PH)PGS.push({pg:D.pg,log:[],rv:0});
    if(!PH&&o.hdr!==false&&pgNo>1)D.drawLine(pgNo+'.',D.pg.w-72-40,42,{font:'m',size:12,align:'right',w:40});   /* page 1 is unnumbered */
    if(revLbl)D.drawLine(revLbl,72,42,{font:'m',size:9});}
  /* a scene that runs onto another page gets (CONTINUED) at the foot and CONTINUED: with the scene number at the top */
  function brk(){
    if(o.cont&&curNum!==null)D.drawLine('(CONTINUED)',X+W-150,D.pg.h-44,{font:'m',size:sz,align:'right',w:150});
    D.newPage();}
  D._onPage=function(){chrome();D.y=TOP;
    if(o.cont&&curNum!==null){
      if(o.nums){D.drawLine(String(curNum),X-44,D.y+sz,{font:'m',size:sz});D.drawLine(String(curNum),X+W+8,D.y+sz,{font:'m',size:sz});}
      D.drawLine('CONTINUED:',X,D.y+sz,{font:'m',size:sz});D.y+=lh*2;}
    tY=D.y;};
  if(o.reuse){chrome();if(!o.keepY)D.y=TOP;tY=D.y;}else D.newPage();
  function avail(){return Math.floor((D.bottom()-D.y+0.5)/lh);}
  function atTop(){return D.y<=tY+0.5;}
  function ensure(n){if(avail()<n)brk();}
  function blank(n){if(!atTop())D.y+=lh*n;}
  function put(l){if(PH&&l.t&&String(l.t).trim()){var hh=PH.h(l.t),oc=seenN[hh]||0;seenN[hh]=oc+1;if(LK){var ix=LK.map[hh+'#'+oc];if(ix!==undefined&&ix>=lpi){if(!atTop())brk();lpi=ix+1;}}}
    if(PH&&PGS.length){var q=PGS[PGS.length-1];if(l.t&&String(l.t).trim())q.log.push(PH.h(l.t));if(l.rv)q.rv=1;}D.drawLine(l.t,X+(l.x||0),D.y+sz,{font:l.f||'m',size:sz,align:l.al,w:l.w||W});if(o.stars&&l.rv)D.drawLine('*',X+W+36,D.y+sz,{font:'m',size:sz});D.y+=lh;}
  function wr(txt,x,w,f,rv){return D.wrap(txt,f||'m',sz,w).map(function(t){return {t:t,x:x,w:w,f:f||'m',rv:rv};});}
  scenes.forEach(function(s,si){
    var hl=wr(s.omit?'OMITTED':s.heading.toUpperCase(),0,W,'mb',s.hrv);curNum=null;
    var blocks=[];
    if(!s.omit){
      var i=0,L=s.lines;
      while(i<L.length){
        var l=L[i],t=l.type,txt=String(l.text||'');
        if(t==='character'){
          var cue=txt.toUpperCase(),items=[{t:cue,x:144,w:W-144,f:'m',cue:1,rv:l.rv}],j=i+1;
          while(j<L.length&&(L[j].type==='dialogue'||L[j].type==='parenthetical')){
            var par=L[j].type==='parenthetical';
            wr(String(L[j].text||''),par?108:72,par?180:252,null,L[j].rv).forEach(function(x){x.d=!par;items.push(x);});j++;}
          blocks.push({k:'dlg',items:items,name:cue});i=j;
        }else if(t==='transition'){blocks.push({k:'tr',items:wr(txt.toUpperCase(),0,W,null,l.rv).map(function(x){x.al='right';return x;})});i++;}
        else if(t==='dialogue'||t==='parenthetical'){blocks.push({k:'act',items:wr(txt,t==='dialogue'?72:108,t==='dialogue'?252:180,null,l.rv)});i++;}
        else{blocks.push({k:'act',items:wr(txt,0,W,null,l.rv)});i++;}
      }
    }
    /* heading: 2 blank lines above, kept with the first two lines that follow it */
    var first=blocks[0]?Math.min(2,blocks[0].items.length):0;
    if(si>0&&!atTop()){ if(avail()<hl.length+2+first+1)brk();else D.y+=lh*2; }
    else if(avail()<hl.length+1+first)brk();
    if(o.nums){D.drawLine(String(s.num),X-44,D.y+sz,{font:'m',size:sz});D.drawLine(String(s.num),X+W+8,D.y+sz,{font:'m',size:sz});}
    hl.forEach(put);curNum=s.omit?null:s.num;
    blocks.forEach(function(bk){
      var it=bk.items,n=it.length;
      blank(1);
      if(bk.k==='tr'){ensure(n);it.forEach(put);return;}
      if(bk.k==='dlg'&&n>avail()){
        var av=avail(),p=-1,q;
        for(q=Math.min(av-1,n-2);q>=3;q--){if(it[q-1].d&&it[q].d){p=q;break;}}   /* split inside the speech, >=2 lines each side, room for (MORE) */
        if(p>0){
          it.slice(0,p).forEach(put);
          put({t:'(MORE)',x:144,w:W-144});
          brk();
          var cue2=Object.assign({},it[0],{t:(/CONT'D/.test(bk.name)?bk.name:bk.name+" (CONT'D)")});
          put(cue2);it.slice(p).forEach(put);return;
        }
        brk();it.forEach(put);return;
      }
      if(n>avail()){
        if(n<=3||avail()<2)brk();
        else{var br=(n-avail()<2)?n-2:avail();if(br<2){brk();}else{it.slice(0,br).forEach(put);brk();it.slice(br).forEach(put);return;}}
      }
      it.forEach(put);
    });
  });
  if(PH)PH.finishPages(D,PGS,{hdr:o.hdr,tint:o.tint,revisedOnly:o.revisedOnly,hasLabel:!!revLbl});
  D._onPage=null;D.m.t=om.t;D.m.b=om.b;D.noFooter=om.nf;
}

    var R=M.rev,revTxt=R&&R.color&&R.color!=='WHITE'?cap(R.color)+' Revisions, '+pcDateLong(R.date,1):(rev?'Revision: '+rev:'');

  scriptPages(D,scenes,{reuse:true,nums:dOpt('script','sceneNums',1),cont:dOpt('script','continued',1),stars:dOpt('script','stars',1),revLabel:dOpt('script','revLabel',1)?rl:'',rev:true,tint:dOpt('script','tint',1),revisedOnly:dOpt('script','revOnly',0)});
