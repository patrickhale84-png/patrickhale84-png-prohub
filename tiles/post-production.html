<style>
:root {
  --ink: #0A0E16;
  --panel: #101725;
  --line: #1E2A3E;
  --paper: #F6F4EF;
  --amber: #E2A93B;
  --lime: #88C13F;
  --cyan: #00ABA9;
  --tx: #E6EBF2;
  --mu: #8493A8;
  --fd: 'Barlow Condensed', Georgia, sans-serif;
  --fm: 'IBM Plex Mono', ui-monospace, monospace;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; width: 100%; background: var(--ink); color: var(--tx); font-family: var(--fm); overflow: hidden; }

/* Top Header Bar */
.topbar {
  height: 44px;
  background: #050810;
  border-bottom: 1px solid var(--line);
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 0 12px;
  position: relative;
  z-index: 100;
}
.brand {
  font-family: 'Bauhaus 93','Bauhaus',Impact,sans-serif;
  font-size: 19px;
  line-height: 1;
  color: #fff;
  cursor: pointer;
}
.brand span { color: var(--lime); }
.badge-stage {
  font-size: 9px;
  font-weight: 700;
  letter-spacing: .12em;
  text-transform: uppercase;
  color: var(--amber);
  background: rgba(226,169,59,.12);
  border: 1px solid rgba(226,169,59,.4);
  padding: 2px 6px;
  border-radius: 4px;
  white-space: nowrap;
}

/* App Switcher Tabs */
.app-tabs {
  display: flex;
  align-items: center;
  gap: 5px;
  margin-left: 10px;
  overflow-x: auto;
  scrollbar-width: none;
}
.app-tabs::-webkit-scrollbar { display: none; }
.tab-btn {
  font-family: var(--fm);
  font-size: 10.5px;
  font-weight: 600;
  letter-spacing: .08em;
  text-transform: uppercase;
  color: var(--mu);
  background: #0E1626;
  border: 1px solid var(--line);
  border-radius: 5px;
  padding: 5px 10px;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  white-space: nowrap;
  transition: all .15s;
}
.tab-btn:hover { color: #fff; border-color: #33456A; }
.tab-btn.active { color: #05070B; font-weight: 700; }
.tab-btn[data-app="filmcraft"].active { background: #E8703A; border-color: #E8703A; color: #fff; }
.tab-btn[data-app="photopea"].active { background: #3B7BF6; border-color: #3B7BF6; color: #fff; }
.tab-btn[data-app="graphite"].active { background: #E2A93B; border-color: #E2A93B; }
.tab-btn[data-app="pitchmaker"].active { background: #B07CE8; border-color: #B07CE8; color: #fff; }
.tab-btn[data-app="scriptlib"].active { background: #5AA9E6; border-color: #5AA9E6; color: #fff; }

.top-right {
  margin-left: auto;
  display: flex;
  align-items: center;
  gap: 8px;
}
.btn-util {
  font-family: var(--fm);
  font-size: 9.5px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: .08em;
  color: var(--mu);
  background: #0E1626;
  border: 1px solid var(--line);
  padding: 5px 8px;
  border-radius: 5px;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 5px;
}
.btn-util:hover { color: #fff; border-color: #33456A; }

/* Stage Viewports */
.stage-wrap {
  width: 100vw;
  height: calc(100vh - 44px);
  position: relative;
  background: #000;
}
.app-view {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  border: 0;
  display: none;
  background: #000;
}
.app-view.active { display: block; }

/* Workbench Areas */
.native-studio {
  position: absolute;
  inset: 0;
  display: none;
  flex-direction: column;
  padding: 16px 20px;
  overflow-y: auto;
  background: var(--ink);
}
.native-studio.active { display: flex; }

.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.note { font-size: 11.5px; color: var(--mu); line-height: 1.5; }
button {
  font-family: var(--fm);
  font-size: 12px;
  padding: 6px 10px;
  border-radius: 6px;
  border: 1px solid var(--line);
  background: #121A28;
  color: #DDE5EF;
  cursor: pointer;
}
button:hover { background: #1B263B; color: #fff; }
button.pri { background: var(--amber); border-color: var(--amber); color: #12161F; font-weight: 600; }
textarea, input, select {
  background: #0D1420;
  border: 1px solid var(--line);
  border-radius: 6px;
  color: #E6EBF2;
  padding: 6px 10px;
  font-family: var(--fm);
  font-size: 12px;
}
textarea:focus, input:focus, select:focus { outline: 1px solid var(--amber); }

.toast {
  position: fixed;
  left: 50%;
  bottom: 20px;
  transform: translate(-50%, 0);
  background: #111A2B;
  border: 1px solid #25344E;
  color: #fff;
  font-size: 10.5px;
  padding: 8px 16px;
  border-radius: 6px;
  z-index: 9999;
  opacity: 0;
  pointer-events: none;
  transition: opacity .18s;
}
.toast.on { opacity: 1; }

.pd-textedit{display:none;}
/* ===== Phone layout (<=768px) ===== */
@media (max-width:768px){
  html,body{height:100dvh;}
  .topbar{height:48px;gap:8px;padding:0 10px;}
  .badge-stage{display:none;}
  .app-tabs{margin-left:2px;flex:1;min-width:0;gap:6px;scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch;}
  .tab-btn{padding:0 12px;min-height:36px;font-size:11px;flex:0 0 auto;scroll-snap-align:center;}
  .top-right{gap:6px;}
  .btn-util{min-height:36px;padding:0 10px;font-size:0;gap:0;}
  .btn-util i{font-size:14px;}
  .stage-wrap{width:100%;height:calc(100dvh - 48px);}
  .native-studio{padding:10px 10px 90px;}
  button,textarea,input,select{font-size:16px;}
  /* script library */
  #slMount > .row{flex-direction:column;align-items:stretch;}
  #slQ{min-width:0!important;width:100%;height:46px!important;font-size:16px!important;}
  #slList{max-height:calc(100dvh - 200px)!important;padding-right:0!important;}
  #slList > div{padding:10px 0!important;}
  #slList span{font-size:14px!important;}
  #slList a{min-height:40px;display:inline-flex;align-items:center;padding:0 14px!important;font-size:12px!important;}
  /* pitch deck studio: live preview on top, controls under it */
  #pdMount{height:auto!important;}
  .pd-wrap{display:flex!important;flex-direction:column;height:auto!important;gap:12px!important;}
  .pd-left,.pd-right{display:contents!important;}
  #pdCanvas{order:1;position:sticky!important;top:-10px;z-index:30;width:800px!important;max-width:none!important;zoom:var(--pdz,.45);
    box-shadow:0 0 0 10px var(--ink);}
  .pd-textedit{order:2;display:flex;flex-direction:column;gap:6px;}
  .pd-textedit textarea{width:100%;min-height:92px;padding:12px;line-height:1.45;resize:vertical;}
  .pd-rail[data-rail="slide"]{order:3;} .pd-rail[data-rail="layout"]{order:4;} .pd-rail[data-rail="graphic"]{order:5;}
  .pd-split{order:6;} .pd-actions{order:7;} .pd-rail[data-rail="genre"]{order:8;} .pd-type{order:9;}
  .pd-rail-lbl{margin:0 0 6px!important;font-size:10px!important;}
  .pd-rail-btns{display:flex!important;gap:8px!important;overflow-x:auto;padding-bottom:4px;scrollbar-width:none;-webkit-overflow-scrolling:touch;}
  .pd-rail-btns::-webkit-scrollbar{display:none;}
  .pd-rail-btns button{flex:0 0 auto;min-height:44px;padding:0 16px!important;font-size:12px!important;border-radius:22px!important;white-space:nowrap;}
  .pd-rail[data-rail="layout"] .pd-rail-btns,.pd-rail[data-rail="graphic"] .pd-rail-btns{display:grid!important;grid-template-columns:1fr 1fr;overflow:visible;}
  .pd-rail[data-rail="layout"] .pd-rail-btns button,.pd-rail[data-rail="graphic"] .pd-rail-btns button{border-radius:8px!important;}
  .pd-rail[data-rail="graphic"] .pd-rail-btns{grid-template-columns:1fr 1fr 1fr;}
  .pd-split{flex-direction:column;align-items:stretch!important;gap:12px!important;padding:12px!important;}
  .pd-split > div,.pd-split #pdCircleControls{display:flex;flex-direction:column;align-items:stretch!important;gap:10px!important;}
  .pd-split #pdCircleControls > div{align-items:center;}
  .pd-split #pdCircleControls{display:none;}
  .pd-split input[type=range]{width:100%!important;height:36px;}
  .pd-split .note{min-width:78px;}
  .pd-split > div:first-child{flex-direction:row;align-items:center!important;}
  .pd-actions{flex-direction:column;align-items:stretch!important;gap:12px!important;margin-top:0!important;}
  .pd-g{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px;border:1px solid var(--line);border-radius:8px;background:#0B101D;}
  .pd-g > .note{width:100%;font-size:10px;letter-spacing:.14em;text-transform:uppercase;}
  .pd-g input[type=file]{flex:1 1 100%;width:100%!important;font-size:14px!important;padding:8px;}
  .pd-g button{flex:1 1 auto;min-height:44px;}
  #pdPrint{margin-left:0!important;min-height:50px;font-size:14px;}
  .pd-type{grid-template-columns:1fr 1fr!important;}
  .pd-type select{min-height:44px;font-size:16px!important;}
  .pd-type input[type=color]{width:56px!important;height:40px!important;}
}
</style>
<style id="pp-edge">

var SL = (function () {
  var items = null;
  function load() {
    if (items) return items;
    items = SL_PACKED.split('\n').map(function (line) {
      var p = line.split('|');
      return { title: p[0] || '', slug: p[1] || '' };
    }).filter(function (x) { return x.title && x.slug; });
    items.sort(function (a, b) { return a.title.localeCompare(b.title); });
    return items;
  }
  function search(q) {
    var all = load(), s = String(q || '').trim().toLowerCase();
    if (!s) return all;
    return all.filter(function (x) { return x.title.toLowerCase().indexOf(s) >= 0; });
  }
  return { load: load, search: search };
})();

function renderScriptLibrary(box) {

}

  return '<div style="width:100%;height:100%;"></div>';
}

function pdCanvasInner() {
  var text = pdText(PD.slide);
  var type = 'font-family:' + pdFace() + ';font-weight:' + PD.wt + ';line-height:1.28;color:' + PD.tx + ';outline:none;' + (PD.caps ? 'text-transform:uppercase;' : '') + 'letter-spacing:' + (PD.track/100) + 'em;font-size:';
  var body = '<div contenteditable="true" data-pd="text" style="' + type + pdSz(61,38) + '">' +
    HUB.esc(text) + '</div>';

  if (PD.layout === 'text') {
    return '<div style="position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:8%">' +
      '<div style="max-width:1000px"><div style="font-size:70px;color:' + PD.accent + ';font-family:' + pdFace() + '">&ldquo;</div>' +
      '<div contenteditable="true" data-pd="text" style="' + type + pdSz(67,45) + '">' + HUB.esc(text) + '</div></div></div>';
  }
  if (PD.layout === 'full') {
    return '<div style="position:absolute;inset:0">' + pdWell() +
      '<div style="position:absolute;inset:auto 0 0 0;padding:45px 54px;background:linear-gradient(transparent,' + pdRgba(PD.bgc,.92) + ')">' + body + '</div></div>';
  }
  if (PD.layout === 'stack') {
    return '<div style="position:absolute;inset:0;display:flex;flex-direction:column">' +
      '<div style="flex:0 0 58%;border-bottom:1px solid ' + PD.accent + '">' + pdWell() + '</div>' +
      '<div style="flex:1 1 auto;padding:38px 48px">' + body + '</div></div>';
  }

  // Adjustable Center Split Layout with Draggable Divider Line
  var pLeft = PD.splitPos;
  var pRight = 100 - PD.splitPos;
  return '<div id="pdSplitStage" style="position:absolute;inset:0;display:flex;width:100%;height:100%;">' +
    '<div style="width:' + pLeft + '%;height:100%;position:relative;overflow:hidden;">' + pdWell() + '</div>' +
    '<div id="pdSplitHandle" title="Drag to adjust split line" style="width:4px;cursor:col-resize;background:' + PD.accent + ';position:relative;z-index:20;flex-shrink:0;"></div>' +
    '<div style="width:' + pRight + '%;height:100%;padding:51px;display:flex;flex-direction:column;justify-content:center;overflow:hidden;">' + body + '</div>' +
  '</div>';
}


var PD_W = 1280, PD_H = 720;
function pdCanvasHTML() {
  return '<div class="pdstage" style="position:absolute;left:0;top:0;width:' + PD_W + 'px;height:' + PD_H + 'px;transform-origin:0 0;overflow:hidden">' + pdCanvasInner() + '</div>';
}
function pdFit(c) {
  var st = c && c.querySelector('.pdstage'); if (!st) return;
  var k = c.clientWidth / PD_W; if (!k) return;
  st.style.transform = 'scale(' + k + ')';
}

function pdPrint() {
  var keep = PD.slide, pages = '';
  PD_SLIDES.forEach(function(sl) {
    PD.slide = sl;
    var inner = pdCanvasInner().replace(/ contenteditable="true"/g, '').replace(/ id="pdSplitHandle"/g, '').replace(/ id="pdSplitStage"/g, '');
    pages += '<section class="pg" style="' + pdBgStyle() + ';color:' + PD.tx + '"><div class="pdstage">' + inner + '</div></section>';
  });
  PD.slide = keep;
  var w = window.open('', '_blank');
  if (!w) { alert('Allow pop-ups to export the deck.'); return; }
  w.document.write('<!DOCTYPE html><html><head><meta charset="utf-8"><title>Pitch deck</title><style>' +
    '@page{size:' + PD_W + 'px ' + PD_H + 'px;margin:0}html,body{margin:0;padding:0;background:#111}' +
    '*{-webkit-print-color-adjust:exact;print-color-adjust:exact;box-sizing:border-box}' +
    '.pg{position:relative;width:' + PD_W + 'px;height:' + PD_H + 'px;overflow:hidden;page-break-after:always;break-after:page;margin:0 auto}' +
    '.pdstage{position:absolute;left:0;top:0;width:' + PD_W + 'px;height:' + PD_H + 'px;overflow:hidden}' +
    '@media screen{.pg{margin:12px auto}}' +
    '</style></head><body>' + pages + '</body></html>');
  w.document.close();
  setTimeout(function(){ try { w.print(); } catch(e){} }, 500);
}

function pdDraw(box) {
  var canvas = box.querySelector('#pdCanvas'); if (!canvas) return;
  canvas.setAttribute('style', 'position:relative;overflow:hidden;border-radius:10px;border:1px solid var(--line);aspect-ratio:16/9;width:100%;flex:0 0 auto;height:auto;' + pdBgStyle() + ';color:' + PD.tx + ';');
  canvas.innerHTML = pdCanvasHTML();
  pdFit(canvas);
  if (!canvas.__ro && window.ResizeObserver) { canvas.__ro = new ResizeObserver(function(){ pdFit(canvas); }); canvas.__ro.observe(canvas); }

  var tint = function(sel, on) {
    box.querySelectorAll(sel).forEach(function(b) {
      b.style.borderColor = on(b) ? PD.accent : 'var(--line)';
      b.style.color = on(b) ? '#fff' : '#8794A6';
    });
  };
  tint('[data-genre]', function(b){ return b.getAttribute('data-genre') === PD.genre; });
  tint('[data-slide]', function(b){ return b.getAttribute('data-slide') === PD.slide; });
  tint('[data-layout]', function(b){ return b.getAttribute('data-layout') === PD.layout; });
  tint('[data-graphic]', function(b){ return b.getAttribute('data-graphic') === PD.graphicMode; });

  var te = box.querySelector('#pdTextEdit');
  if (te && document.activeElement !== te) te.value = PD.slides[PD.slide] || '';
  if (te) te.placeholder = PD_PH[PD.slide] || 'Type the text for this slide...';
  var tf2 = box.querySelector('#pdTextFor'); if (tf2) tf2.textContent = '· ' + PD.slide;
  var f = box.querySelector('#pdFaceName'); if (f) f.textContent = PD_FACES[PD.display][0];
  var bf = box.querySelector('#pdBodyName'); if (bf) bf.textContent = PD_BODIES[PD.body][0];
  var ln = box.querySelector('#pdLayoutName'); if (ln) ln.textContent = PD.layout;
  var av = box.querySelector('#pdAccentVal'); if (av) av.textContent = PD.accent;

  // Sync circle control panels visibility
  var cg = box.querySelector('#pdCircleControls');
  if (cg) cg.style.display = (PD.graphicMode === 'circle') ? 'grid' : 'none';

  pdBind(box);
  pdBind2(box);
}

function pdBind(box) {
  var te = box.querySelector('#pdTextEdit');
  if (te) te.oninput = function(){
    PD.slides[PD.slide] = te.value; pdPub();
    var node = box.querySelector('[data-pd="text"]'); if (node) node.textContent = te.value || pdText(PD.slide);
  };
  var t = box.querySelector('[data-pd="text"]');
  if (t) t.addEventListener('blur', function(){ PD.slides[PD.slide] = t.textContent.trim(); pdPub(); });
  box.querySelectorAll('[data-genre]').forEach(function(b){ b.onclick = function(){ PD.genre = b.getAttribute('data-genre'); pdPub(); pdDraw(box); }; });
  box.querySelectorAll('[data-slide]').forEach(function(b){ b.onclick = function(){ PD.slide = b.getAttribute('data-slide'); pdPub(); pdDraw(box); }; });
  box.querySelectorAll('[data-layout]').forEach(function(b){ b.onclick = function(){ PD.layout = b.getAttribute('data-layout'); pdPub(); pdDraw(box); }; });
  box.querySelectorAll('[data-graphic]').forEach(function(b){ b.onclick = function(){ PD.graphicMode = b.getAttribute('data-graphic'); pdPub(); pdDraw(box); }; });

  // Draggable Split Divider Line
  var handle = box.querySelector('#pdSplitHandle');
  if (handle) {
    handle.onmousedown = function(e) {
      e.preventDefault();
      var stage = box.querySelector('#pdSplitStage');
      function onMove(ev) {
        var rect = stage.getBoundingClientRect();
        var pct = Math.round(((ev.clientX - rect.left) / rect.width) * 100);
        PD.splitPos = Math.max(15, Math.min(85, pct));
        var sl = box.querySelector('#pdSplitRange');
        if (sl) sl.value = PD.splitPos;
        pdDraw(box);
      }
      function onUp() {
        window.removeEventListener('mousemove', onMove);
        window.removeEventListener('mouseup', onUp);
        pdPub();
      }
      window.addEventListener('mousemove', onMove);
      window.addEventListener('mouseup', onUp);
    };
  }

  if (handle) {
    handle.addEventListener('touchstart', function(e){
      var stage = box.querySelector('#pdSplitStage'); if (!stage) return;
      function mv(ev){
        ev.preventDefault();
        var tt = ev.touches[0], rect = stage.getBoundingClientRect();
        PD.splitPos = Math.max(15, Math.min(85, Math.round(((tt.clientX - rect.left) / rect.width) * 100)));
        var sl = box.querySelector('#pdSplitRange'); if (sl) sl.value = PD.splitPos;
        var kids = stage.children; kids[0].style.width = PD.splitPos + '%'; kids[2].style.width = (100 - PD.splitPos) + '%';
      }
      function up(){ window.removeEventListener('touchmove', mv); window.removeEventListener('touchend', up); pdPub(); pdDraw(box); }
      window.addEventListener('touchmove', mv, {passive:false}); window.addEventListener('touchend', up);
    }, {passive:true});
  }

  // Sliders for Split & Circle
  var sSplit = box.querySelector('#pdSplitRange');
  if (sSplit) sSplit.oninput = function() { PD.splitPos = +sSplit.value; pdDraw(box); pdPub(); };
  var cSize = box.querySelector('#pdCircleSize');
  if (cSize) cSize.oninput = function() { PD.circleSize = +cSize.value; pdDraw(box); pdPub(); };
  var cX = box.querySelector('#pdCircleX');
  if (cX) cX.oninput = function() { PD.circleX = +cX.value; pdDraw(box); pdPub(); };
  var cY = box.querySelector('#pdCircleY');
  if (cY) cY.oninput = function() { PD.circleY = +cY.value; pdDraw(box); pdPub(); };

  var fs = box.querySelector('#pdFace'); if (fs) fs.onchange = function(){ PD.display = +fs.value; pdPub(); pdDraw(box); };
  var bs = box.querySelector('#pdBody'); if (bs) bs.onchange = function(){ PD.body = +bs.value; pdPub(); pdDraw(box); };
  var ac = box.querySelector('#pdAccent'); if (ac) { ac.oninput = function(){ PD.accent = ac.value; pdDraw(box); }; ac.onchange = function(){ pdPub(); }; }

  var up = box.querySelector('#pdImgFile'); if (up) up.onchange = function(){
    var f = up.files && up.files[0]; if (!f) return;
    var fr = new FileReader(); fr.onload = function(){ PD.slidesAt[PD.slide] = fr.result; pdPub(); pdDraw(box); }; fr.readAsDataURL(f);
  };
  var u2 = box.querySelector('#pdImgUrl'); if (u2) u2.onclick = function(){
    var u = window.prompt('Image URL for this slide:', ''); if (u) { PD.slidesAt[PD.slide] = u; pdPub(); pdDraw(box); }
  };
  var bu = box.querySelector('#pdBgFile'); if (bu) bu.onchange = function(){
    var f = bu.files && bu.files[0]; if (!f) return;
    var fr = new FileReader(); fr.onload = function(){ PD.bg = fr.result; PD.bgMode = 'image'; pdPub(); pdDraw(box); }; fr.readAsDataURL(f);
  };
  var b2 = box.querySelector('#pdBgUrl'); if (b2) b2.onclick = function(){
    var u = window.prompt('Background image URL:', PD.bgMode === 'image' ? PD.bg : ''); if (u) { PD.bg = u; PD.bgMode = 'image'; pdPub(); pdDraw(box); }
  };
  var cl = box.querySelector('#pdBgClear'); if (cl) cl.onclick = function(){ PD.bg = ''; PD.bgMode = 'colour'; pdPub(); pdDraw(box); };
  var pr = box.querySelector('#pdPrint'); if (pr) pr.onclick = pdPrint;
}


function pdBind2(box){
  var $=function(i){return box.querySelector(i)};
  var fs=$('#pdFs'),fv=$('#pdFsVal'),all=$('#pdFsAll');
  if(fs){ if(document.activeElement!==fs) fs.value=pdScale(); fv.textContent=pdScale()+'%';
    fs.oninput=function(){ var v=+fs.value; if(PD.fsScope==='all'){ PD.fsAll=v; PD.fs={}; } else { PD.fs[PD.slide]=v; } PD.tpl=''; fv.textContent=v+'%'; pdPub(); var c=$('#pdCanvas'); if(c) { c.innerHTML=pdCanvasHTML(); pdFit(c); pdBind(box); } }; }
  if(all){ all.checked=PD.fsScope==='all'; all.onchange=function(){ PD.fsScope=all.checked?'all':'slide'; pdPub(); }; }
  var tr=$('#pdTrack'); if(tr){ tr.value=PD.track; tr.oninput=function(){ PD.track=+tr.value; pdPub(); pdDraw(box); }; }
  var wt=$('#pdWt'); if(wt){ wt.value=String(PD.wt); wt.onchange=function(){ PD.wt=+wt.value; pdPub(); pdDraw(box); }; }
  var cp=$('#pdCaps'); if(cp){ cp.checked=!!PD.caps; cp.onchange=function(){ PD.caps=cp.checked?1:0; pdPub(); pdDraw(box); }; }
  [['#pdBgc','bgc'],['#pdTx','tx'],['#pdAccent2','accent']].forEach(function(p){ var e=$(p[0]); if(!e) return; e.value=PD[p[1]];
    e.oninput=function(){ PD[p[1]]=e.value; PD.tpl=''; var c=$('#pdCanvas'); if(c){ c.style.background=PD.bgc; c.style.color=PD.tx; c.innerHTML=pdCanvasHTML(); pdFit(c); pdBind(box);} };
    e.onchange=function(){ pdPub(); pdDraw(box); }; });
  var sw=$('#pdSwap'); if(sw) sw.onclick=function(){ var t=PD.bgc; PD.bgc=PD.tx; PD.tx=t; PD.tpl=''; pdPub(); pdDraw(box); };
  box.querySelectorAll('[data-tpl]').forEach(function(b){ b.style.borderColor = b.getAttribute('data-tpl')===PD.tpl ? PD.accent : 'var(--line)';
    b.onclick=function(){ pdApplyTpl(b.getAttribute('data-tpl')); pdPub(); var f=$('#pdFace'); if(f) f.value=PD.display; var bd=$('#pdBody'); if(bd) bd.value=PD.body; pdDraw(box); }; });
}

window.openDeskDetail = function(appId) {

  });
  document.querySelectorAll('.app-view, .native-studio').forEach(function(view){
    view.classList.remove('active');
  });

  var target = document.getElementById('view-' + appId);
  if (!target) return;
  target.classList.add('active');

  if (target.tagName === 'IFRAME') {
    var computedSrc = APP_URLS[appId] || '';
    if (computedSrc && target.getAttribute('src') !== computedSrc) {
      target.src = computedSrc;
    }
  }
};

document.getElementById('appTabs').addEventListener('click', function(e){
  var btn = e.target.closest('[data-app]');
  if (btn) window.openDeskDetail(btn.getAttribute('data-app'));
});

document.getElementById('btnPopout').addEventListener('click', function(){
  if (APP_URLS[CURRENT_APP]) {
    window.open(APP_URLS[CURRENT_APP], '_blank', 'noopener');
  } else if (CURRENT_APP === 'pitchmaker') {
    pdPrint();
  } else {
    alert('This workspace operates natively inside the post suite.');
  }
});

// Mount modules on load
renderPitchDeck(document.getElementById('pdMount'));
renderScriptLibrary(document.getElementById('slMount'));

// Route from URL hash or fallback to FilmCraft
var initApp = 'filmcraft';
if (window.location.hash) {
  var h = window.location.hash.replace('#', '').toLowerCase();
  if (['filmcraft','photopea','graphite','pitchmaker','scriptlib'].indexOf(h) >= 0) initApp = h;
}
window.openDeskDetail(initApp);

function hubGo(page, ev){
  if(ev && ev.preventDefault) ev.preventDefault();
  var u = page;
  try { u = new URL(page, location.href).href; } catch(e) {}
  var emb = false; try { emb = window.self !== window.top; } catch(e) { emb = true; }
  if(emb){
    /* inside the proHUB dashboard: never replace the whole window. Ask the dashboard to close or switch tile instead. */
    try {
      var base = String(page).split('#')[0].split('/').pop(), hash = (String(page).split('#')[1] || '');
      if(!base || /^index\.html$/i.test(base)) { window.parent.postMessage({k:'close'}, '*'); return; }
      window.parent.postMessage({k:'hub-open', file: base, a: hash}, '*'); return;
    } catch(e) {}
  }
  try { location.href = u; } catch(e) {}
}
  /* =========================================================================
   PARENT FRAME NAVIGATION LISTENER & DYNAMIC DESK ACTIVATION
   ========================================================================= */
window.addEventListener('message', function(ev){
  if (!ev || !ev.data) return;
  var d = ev.data;
  var targetDesk = d.a || d.app || '';
  if (targetDesk && typeof window.openDeskDetail === 'function') {
    window.openDeskDetail(targetDesk);
  }
});

window.addEventListener('hashchange', function(){
  var h = (window.location.hash || '').replace('#', '').trim();
  if (h && typeof window.openDeskDetail === 'function') {
    window.openDeskDetail(h);
  }
});
</script>
